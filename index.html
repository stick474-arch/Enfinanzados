      <div class="ct">Músculo financiero</div>
      <label class="fl">¿Con cuánto arrancaron este mes? (cuentas + ahorros de los dos)</label>
      <input type="text" inputmode="numeric" placeholder="$ 0" value="${fmtInit(saldoIni||"")}" oninput="fmtAmountInput(this,()=>{})" onchange="doSetSaldoInicial(this.value)"/>
      <div class="chips">${[6,12,24].map(h=>`<div class="chip${n===h?" on":""}" onclick="juntosHorizon=${h};render()">${h} meses</div>`).join("")}${hasPriced?`<div class="chip${withWish?" on":""}" onclick="juntosWithWish=!juntosWithWish;render()">${withWish?"✓ ":""}Con wishlist</div>`:""}</div>
      <div class="j-tiles" style="margin-bottom:0;">
        <div class="j-tile"><div class="k">Saldo en ${moLabel(endRow.key)}</div><div class="v" style="color:${endRow.saldo<0?"var(--bad)":"var(--ink)"};">${fmt(endRow.saldo)}</div></div>
        <div class="j-tile"><div class="k">Mes más apretado · ${moLabel(tight.key)}</div><div class="v" style="color:${tight.net<0?"var(--bad)":"var(--ink)"};">${fmt(tight.net)}</div></div>
        <div class="j-tile"><div class="k">Promedio al mes</div><div class="v">${fmt(avg)}</div></div>
      </div>
    </div>
    <div class="card">
        <div class="ct" style="margin-bottom:4px;">Saldo acumulado</div>
        ${withWish?`<div class="j-legend"><span><i class="ln"></i>Sin compras</span><span><i class="ln dash"></i>Comprando la wishlist</span></div>`:""}
        ${buildSaldoChart(rows,wishSaldos,groups)}
        ${groups.length?`<div style="margin-top:10px;">${groups.map(g=>`<div class="j-ev"><span class="num">${g.n}</span><div>${g.items.map(e=>`<div><b>${moLabel(e.key)}</b> · ${escH(e.text)}</div>`).join("")}</div></div>`).join("")}</div>`:""}
      </div>
      <div class="card">

        ${buildFlujoChart(rows)}

      </div>
    ${tableHtml?`<div class="card"><div class="ct" style="margin-bottom:0;">Mes a mes</div>${tableHtml}</div>`:""}
    <div class="grid-2">
      ${renderLeverage(d)}
      <div class="card-quiet">
        <div class="ct">Qué no incluye la curva</div>

          • Gastos que aún no han agregado, como mercado y gastos de ${escH(d.names.A)}. Por eso hoy se ve más alta de lo real.<br>

// ── Proyección ─────────────────────────────────────────────────────────────
function moKey(yr,mo){return yr+"-"+String(mo).padStart(2,"0");}
function moElapsed(startKey,curKey){
  const sy=parseInt(startKey.slice(0,4)),sm=parseInt(startKey.slice(5));
  const cy=parseInt(curKey.slice(0,4)),cm=parseInt(curKey.slice(5));
  return(cy-sy)*12+(cm-sm);
}
// An override value may be a plain number (total) or {A,B} (per-person). Returns the total.
function ovTotal(ov,fallback){
  if(ov==null)return fallback;
  if(typeof ov==="object")return(Number(ov.A)||0)+(Number(ov.B)||0);
  return Number(ov)||0;
}
// Per-person split of a recurring item for a given month. base amount is a total.
function recSplitForMonth(r,key,base,sp){
  const ov=(r.overrides&&r.overrides[key]!=null)?r.overrides[key]:null;
  if(ov&&typeof ov==="object")return{a:Number(ov.A)||0,b:Number(ov.B)||0,total:(Number(ov.A)||0)+(Number(ov.B)||0),isOv:true};
  const total=ov!=null?Number(ov)||0:base;
  const a=Math.round(total*(sp.A/100));
  return{a,b:total-a,total,isOv:ov!=null};
}

function buildProjection(d,n){
  n=n||12;
  const sp=d.split||{A:50,B:50};
  const rows=[];
  const now=new Date();
  // Pre-build set of recurring debt IDs to avoid double-counting
  const recDebtCats=new Set((d.recurring||[]).filter(r=>r.type==="debt"&&(r.debtMonths||0)>1).map(r=>r.category+"|"+r.description));
  for(let i=0;i<n;i++){
    const date=new Date(now.getFullYear(),now.getMonth()+i,1);
    const key=moKey(date.getFullYear(),date.getMonth()+1);
    let income=0,expenses=0,shareA=0,shareB=0; // shareA/B = what each person puts toward shared outflows
    let shTotal=0,shA=0; // shared-only: total shared outflow + A's shared contribution (for balance projection)
    // Recurring items
    (d.recurring||[]).forEach(r=>{
      if(!recInMonth(r,key))return;
      const ov=(r.overrides&&r.overrides[key]!=null)?r.overrides[key]:null;
      let amt,isExp;
      if(r.type==="debt"&&(r.debtMonths||0)>1){
        const monthly=Math.round(r.amount/(r.debtMonths));
        const startKey=(r.debtStart||key).slice(0,7);
        const elapsed=moElapsed(startKey,key);
        if(elapsed<0||elapsed>=(r.debtMonths))return;
        amt=ovTotal(ov,monthly);isExp=true;
      }else if(r.type==="income"){
        amt=ovTotal(ov,r.amount);isExp=false;
      }else{
        amt=ovTotal(ov,r.amount);isExp=true;
      }
      if(isExp){
        expenses+=amt;
        if(r.user==="shared"){
          const s=recSplitForMonth(r,key,r.type==="debt"&&(r.debtMonths||0)>1?Math.round(r.amount/r.debtMonths):r.amount,sp);
          shareA+=s.a;shareB+=s.b;shTotal+=amt;shA+=s.a;
        }else if(r.user==="A")shareA+=amt;else if(r.user==="B")shareB+=amt;
      }else income+=amt;
    });
    // Non-recurring debt entries with installments (no duplicate with recurring)
    (d.entries||[]).filter(e=>e.type==="debt"&&(e.debtMonths||0)>1&&!e.isRecurring&&!e.closed&&!e.autoPayroll).forEach(e=>{
      const startKey=(e.debtStart||e.date||"").slice(0,7);
      if(!startKey)return;
      const elapsed=moElapsed(startKey,key);
      if(elapsed<0||elapsed>=(e.debtMonths))return;
      // Skip if covered by a recurring item
      if(recDebtCats.has(e.category+"|"+(e.description||"")))return;
      const monthly=minPaymentOf(d,e);
      expenses+=monthly;
      if(e.user==="shared"){const a=Math.round(monthly*sp.A/100);shareA+=a;shareB+=monthly-a;shTotal+=monthly;shA+=a;}
      else if(e.user==="A")shareA+=monthly;else if(e.user==="B")shareB+=monthly;
    });
    const advA=Math.round(shA-shTotal*(sp.A/100)); // >0: A pays above fair share this month (B owes A more)
    rows.push({key,mo:String(date.getMonth()+1).padStart(2,"0"),income,expenses,net:income-expenses,shareA,shareB,advA});
  }
  return rows;
}

function buildProjChart(proj){
  if(!proj||proj.length<1)return"";
  const n=proj.length;
  const W=Math.max(360,n*40),H=180;
  const pL=4,pR=4,pT=14,pB=28;
  const cW=W-pL-pR,cH=H-pT-pB;
  const MNAMES=["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
  const allVals=proj.flatMap(p=>[p.income,p.expenses,p.net,0]);
  const minV=Math.min(...allVals);
  const maxV=Math.max(...allVals,1);
  const range=maxV-minV||1;
  const scY=v=>pT+cH*(1-(v-minV)/range);
  const zY=scY(0);
  const bw=Math.max(6,Math.floor(cW/n*0.38));
  const gW=cW/n;
  let shapes="",netPts=[];
  proj.forEach((p,i)=>{
    const cx=pL+gW*i+gW/2;
    const x1=cx-bw-1,x2=cx+1;
    if(p.income>0){const y=scY(p.income);shapes+=`<rect x="${x1.toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${Math.max(1,zY-y).toFixed(1)}" rx="2" fill="color-mix(in srgb, var(--good) 44%, transparent)"/>`;}
    if(p.expenses>0){const y=scY(p.expenses);shapes+=`<rect x="${x2.toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${Math.max(1,zY-y).toFixed(1)}" rx="2" fill="color-mix(in srgb, var(--bad) 44%, transparent)"/>`;}
    const moIdx=parseInt(p.key.slice(5))-1;
    shapes+=`<text x="${cx.toFixed(1)}" y="${(H-6).toFixed(1)}" text-anchor="middle" font-size="8" fill="var(--ink3)" font-family="monospace">${MNAMES[moIdx]||p.key.slice(5)}</text>`;
    const ny=Math.max(pT+1,Math.min(pT+cH-1,scY(p.net)));
    netPts.push([cx,ny]);
  });
  const netPath=netPts.map((pt,i)=>(i===0?"M":"L")+pt[0].toFixed(1)+" "+pt[1].toFixed(1)).join(" ");
  const netDots=netPts.map(pt=>`<circle cx="${pt[0].toFixed(1)}" cy="${pt[1].toFixed(1)}" r="2.5" fill="var(--gold)"/>`).join("");
  const gridLines=[0.25,0.5,0.75].map(f=>{
    const y=(pT+cH*(1-f)).toFixed(1);
    return`<line x1="${pL}" x2="${W-pR}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="0.5"/>`;
  }).join("");
  return`<div style="overflow-x:auto;background:var(--bg2);border-radius:8px;padding:4px 2px;margin:0 -2px;">
  <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="display:block;">
    ${gridLines}
    <line x1="${pL}" x2="${W-pR}" y1="${zY.toFixed(1)}" y2="${zY.toFixed(1)}" stroke="var(--line2)" stroke-width="1"/>
    ${shapes}
    <path d="${netPath}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round"/>
    ${netDots}
  </svg>
  </div>
  <div style="display:flex;gap:14px;justify-content:center;margin-top:6px;">
    <span style="font-size:10px;font-family:monospace;color:var(--good);">■ Ingresos</span>
    <span style="font-size:10px;font-family:monospace;color:var(--bad);">■ Egresos</span>
    <span style="font-size:10px;font-family:monospace;color:var(--gold);">— Flujo neto</span>
  </div>`;
}

function amortize(balance,monthlyRate,months){
  if(!balance||!monthlyRate||monthlyRate<=0||!months||months<1)return[];
  const payment=balance*monthlyRate/(1-Math.pow(1+monthlyRate,-months));
  const rows=[];
  let rem=balance;
  for(let m=0;m<months&&rem>0.5;m++){
    const interest=rem*monthlyRate;
    const principal=Math.min(payment-interest,rem);
    rem-=principal;
    rows.push({m:m+1,payment:Math.round(payment),interest:Math.round(interest),principal:Math.round(principal),remaining:Math.max(0,Math.round(rem))});
  }
  return rows;
}

          return`<div style="display:flex;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid color-mix(in srgb, var(--line) 13%, transparent);">
            <span style="font-size:11px;color:var(--ink2d);font-family:monospace;min-width:64px;">${p.key}</span>
            <input id="proj-ov-inp" type="text" style="flex:1;font-size:13px;margin:0;padding:6px 10px;" value="${fmtInit(projOverrideVal)}" oninput="fmtAmountInput(this,v=>projOverrideVal=v)" placeholder="${fmtInit(monthBase)}"/>
            <button class="btn-sm" style="background:var(--good);color:#fff;" onclick="event.stopPropagation();doSaveOverride()">✓</button>
            <button class="btn-sm btn-dark" onclick="event.stopPropagation();projOverrideEdit=null;render()">✕</button>
          </div>`;
        }
        if(isShared){
          return`<div style="display:flex;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid color-mix(in srgb, var(--line) 13%, transparent);">
            <span style="font-size:11px;color:var(--ink2d);font-family:monospace;min-width:54px;">${p.key}</span>
            <span style="flex:1;font-size:12px;font-family:monospace;color:${s.isOv?"var(--gold)":"var(--ink)"};"><span style="color:var(--pa);">${d.names.A}:</span> ${fmt(s.a)} &nbsp;<span style="color:var(--pb);">${d.names.B}:</span> ${fmt(s.b)}</span>
            ${isDebt?`<button class="btn-sm" style="background:color-mix(in srgb, var(--gold) 9%, transparent);border:1px solid color-mix(in srgb, var(--gold) 27%, transparent);color:var(--gold);font-size:11px;" onclick="event.stopPropagation();doPayCuotaFromProj(${r.id},${s.a},${s.b})">💳</button>`:""}
            <button class="btn-sm btn-dark" onclick="event.stopPropagation();doStartOverrideEdit(${r.id},'${p.key}',${s.a},${s.b},1)">✏️</button>
            ${s.isOv?`<button class="btn-sm" style="background:var(--line);color:var(--bad);border:1px solid color-mix(in srgb, var(--bad) 20%, transparent);" onclick="event.stopPropagation();doClearOverride(${r.id},'${p.key}')">✕</button>`:""}
          </div>`;
        }
        return`<div style="display:flex;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid color-mix(in srgb, var(--line) 13%, transparent);">
          <span style="font-size:11px;color:var(--ink2d);font-family:monospace;min-width:64px;">${p.key}</span>
          <span style="flex:1;font-size:13px;font-family:monospace;color:${s.isOv?"var(--gold)":"var(--ink)"};">${fmt(s.total)}</span>
          ${isDebt?`<button class="btn-sm" style="background:color-mix(in srgb, var(--gold) 9%, transparent);border:1px solid color-mix(in srgb, var(--gold) 27%, transparent);color:var(--gold);font-size:11px;" onclick="event.stopPropagation();doPayCuotaFromProj(${r.id},${s.total},0)">💳</button>`:""}
          <button class="btn-sm btn-dark" onclick="event.stopPropagation();doStartOverrideEdit(${r.id},'${p.key}',${s.total},0,0)">✏️</button>
          ${s.isOv?`<button class="btn-sm" style="background:var(--line);color:var(--bad);border:1px solid color-mix(in srgb, var(--bad) 20%, transparent);" onclick="event.stopPropagation();doClearOverride(${r.id},'${p.key}')">✕</button>`:""}
        </div>`;
      }).join(""):"";
      return`<div class="card" style="margin-bottom:8px;">
        <div class="row" style="cursor:pointer;" onclick="doToggleProjRec(${r.id})">
          <div>
            <div style="font-size:13px;font-weight:600;">${icon(r.category)} ${r.description}${isShared?` <span class="tag" style="background:color-mix(in srgb, var(--gold) 9%, transparent);color:var(--gold);border:1px solid color-mix(in srgb, var(--gold) 27%, transparent);">Compartida</span>`:""}</div>
            <div style="font-size:10px;color:var(--ink3);font-family:monospace;margin-top:2px;">${r.type==="income"?"💰 Ingreso":isDebt?"🏦 Deuda":"💸 Egreso"} · ${isDebt?"cuota":"base"}: ${fmt(monthBase)}${ovCount>0?" · "+ovCount+" ajuste"+(ovCount!==1?"s":""):""}</div>
          </div>
          <span style="font-size:13px;color:var(--ink3);">${isExpanded?"▲":"▼"}</span>
        </div>
        ${isExpanded?`<div style="margin-top:6px;border-top:1px solid var(--line);padding-top:6px;">${isShared?`<div style="font-size:10px;color:var(--ink3);font-family:monospace;margin-bottom:4px;">Edita cuánto pone cada uno por mes · al cambiar uno, el otro se completa con el resto</div>`:""}${monthRows}</div>`:""}
      </div>`;
    }).join("");
  const debtRecs=recItems.filter(r=>r.type==="expense"||r.type==="debt");
  const amorHtml=debtRecs.length===0?"":debtRecs.map(r=>{
    const isOpen=projAmorId===r.id;
    return`<div class="card" style="margin-bottom:8px;">
      <div class="row" style="cursor:pointer;" onclick="doToggleAmor(${r.id})">
        <div>
          <div style="font-size:13px;font-weight:600;">${icon(r.category)} ${r.description}</div>
          <div style="font-size:10px;color:var(--ink3);font-family:monospace;margin-top:2px;">Cuota base: ${fmtS(r.amount)}</div>
        </div>
        <span style="font-size:13px;color:var(--ink3);">${isOpen?"▲":"▼"}</span>
      </div>
      ${isOpen?renderAmortSection(r):""}
    </div>`;
  }).join("");
  return`<div class="sec">
    <div class="card">
      <div class="ct">Proyección de flujo de caja</div>
      <div class="help-box">Basado en tus ingresos y gastos recurrentes. Ajusta cuotas variables en la sección de abajo para refinarla.</div>
      <div class="chips" style="margin-bottom:12px;">
        ${[6,12,24].map(n=>`<div class="chip${projMonths===n?" on":""}" onclick="projMonths=${n};render()">${n} meses</div>`).join("")}
      </div>
      ${statsHtml}
      ${chart}
      ${tableHtml}
    </div>
    <div class="ct" style="margin-top:16px;padding-left:2px;">Cuotas variables por mes</div>
    <div class="help-box">Toca un recurrente y edita su valor para un mes específico. Los cambios se reflejan en la proyección arriba.</div>
    ${varItemsHtml}
    ${debtRecs.length>0?`
      <div class="ct" style="margin-top:16px;padding-left:2px;">Amortización de deudas</div>
      <div class="help-box">Ingresa saldo pendiente, tasa mensual (%) y plazo para ver la tabla de pagos e intereses.</div>
      ${amorHtml}
    `:""}
  </div>`;
}

function doToggleProjRec(id){
  const rid=Number(id)||id;
  projExpandedRec=projExpandedRec===rid?null:rid;
  projOverrideEdit=null;
  render();
}

function doToggleAmor(id){
  const rid=Number(id)||id;
  if(projAmorId!==rid)projAmorData={balance:"",rate:"",months:""};
  projAmorId=projAmorId===rid?null:rid;
  render();
}

function doStartOverrideEdit(recId,monthKey,curA,curB,shared){
  projOverrideEdit={recId:Number(recId)||recId,monthKey,shared:!!shared};
  projOverrideVal=String(curA||"");
  projOverrideValB=String(curB||"");
  render();
  setTimeout(()=>{const inp=document.getElementById("proj-ov-inp");if(inp)inp.focus();},50);
}

async function doSaveOverride(){
  if(!projOverrideEdit)return;
  const{recId,monthKey,shared}=projOverrideEdit;
  const d=D();
  let val;
  if(shared){
    val={A:Number(projOverrideVal)||0,B:Number(projOverrideValB)||0};
  }else{
    const amt=Number(projOverrideVal);
    if(isNaN(amt)){projOverrideEdit=null;render();return;}
    val=amt;
  }
  const newRec=(d.recurring||[]).map(r=>{
    if((Number(r.id)||r.id)!==recId)return r;
    const overrides={...(r.overrides||{}),[monthKey]:val};
    return{...r,overrides};
  });
  projOverrideEdit=null;
  await persist({...d,recurring:newRec});
  showToast("✓ Cuota ajustada");
}

async function doClearOverride(recId,monthKey){
  const rid=Number(recId)||recId;
  const d=D();
  const newRec=(d.recurring||[]).map(r=>{
    if((Number(r.id)||r.id)!==rid)return r;
    const ovs={...(r.overrides||{})};
    delete ovs[monthKey];
    return{...r,overrides:ovs};
  });
  await persist({...d,recurring:newRec});
  showToast("✓ Cuota restablecida");
}

// ── Boot ───────────────────────────────────────────────────────────────────
async function boot(){
  if(authEnabled()){
    let stored=null;
    try{stored=JSON.parse(localStorage.getItem("auth_session")||"null");}catch(e){}
    if(!stored||!stored.refreshToken){
      try{localStorage.removeItem("finanzas_cache");}catch(e){}
      render();return;
    }
    authSession={idToken:null,expiresAt:0,refreshToken:stored.refreshToken,email:stored.email};
    if(!await refreshSession()){sessionExpired();return;}
  }
  startApp();
}
async function startApp(){
  // Load from localStorage as instant fallback
  const cached=localStorage.getItem("finanzas_cache");
  if(cached){try{localData=migrate(JSON.parse(cached));}catch(e){}}
  if(!localData)localData=emptyState();
  render();

  // Load from Firebase
  const remote=await loadFromFirebase();
  if(remote){
    fbOnline=true;
    localData=migrate(remote);
    localStorage.setItem("finanzas_cache",JSON.stringify(localData));
    if(lastSeenCount===0&&(localData.entries||[]).length>0){lastSeenCount=(localData.entries||[]).length;localStorage.setItem("lastSeenCount",String(lastSeenCount));}
    render();
    runAutoIncomes();
  }
  updateSavingUI(false);

  // Poll Firebase every 30s for real-time sync
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(async()=>{
    const r=await loadFromFirebase();
    if(r){fbOnline=true;localData=migrate(r);localStorage.setItem("finanzas_cache",JSON.stringify(localData));const ae=document.activeElement;const typing=ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName);if(tab!=="agregar"&&!typing)render();updateSavingUI(false);runAutoIncomes();}
  },30000);
}

// Override persist to also cache locally
const _persist=persist;
window.persist=async function(nd){
  localStorage.setItem("finanzas_cache",JSON.stringify(nd));
  await _persist(nd);
};

boot();
</script>
