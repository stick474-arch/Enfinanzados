      </div>
      <div class="card" style="padding:10px 14px;background:var(--inset);margin-bottom:10px;"><span style="font-size:14px;color:var(--gold);font-weight:600;">→ ${nm(newLoan.from==="A"?"B":"A")}</span></div>
      <label class="fl">Monto (COP)</label>

      <label class="fl">Descripción</label>
      <input type="text" placeholder="Ej: Para el arriendo…" value="${escH(newLoan.description||"")}" oninput="newLoan.description=this.value"/>
      <label class="fl">Detalle (opcional)</label>

      <label class="fl">Cuotas para devolver</label>
      <div class="chips">
        ${[1,2,3,4,6,12].map(n=>`<div class="chip${newLoan.installments===n?" on":""}" onclick="newLoan.installments=${n};render()">${n===1?"Un pago":n+" cuotas"}</div>`).join("")}
      </div>
      ${newLoan.amount&&Number(newLoan.amount)>0&&newLoan.installments>1?`<div class="card" style="padding:10px 14px;background:var(--surf-warn);border:1px solid color-mix(in srgb, var(--gold) 20%, transparent);margin-bottom:10px;"><div style="font-size:12px;color:var(--gold);font-family:monospace;">💡 ${nm(newLoan.from==="A"?"B":"A")} pagaría ${fmt(Number(newLoan.amount)/newLoan.installments)}/mes durante ${newLoan.installments} meses</div></div>`:""}
      <label class="fl">Fecha</label>
      <input type="date" value="${newLoan.date}" onchange="newLoan.date=this.value"/>
      <label class="fl">Nota</label>
      <input type="text" placeholder="Condiciones, detalles…" value="${newLoan.note||""}" oninput="newLoan.note=this.value"/>
      <button class="btn" onclick="doAddLoan()" ${saving?"disabled":""}>${editLoanId?"💾 Guardar cambios":"✓ Registrar préstamo"}</button>
    </div>`:""}
    ${active.length===0&&!showNewLoan?`<div style="text-align:center;color:var(--ink3);margin-top:40px;font-size:14px;"><div style="font-size:40px;margin-bottom:12px;">🤝</div>Sin préstamos activos</div>`:""}
    ${active.map(loan=>{

      return`<div class="card">
        <div class="row" style="margin-bottom:6px;">
          <span style="font-size:15px;font-weight:700;">${loan.description}</span>
          <span class="tag" style="background:color-mix(in srgb, ${color} 9%, transparent);color:${color};border:1px solid color-mix(in srgb, ${color} 20%, transparent);">${nm(loan.from)}→${nm(loan.to)}</span>
        </div>
        <div style="font-size:11px;color:var(--ink3);margin-bottom:${(loan.items||[]).length?"4px":"12px"};font-family:monospace;">${loan.date}${loan.note?` · ${loan.note}`:""}</div>
        ${(loan.items||[]).length?`<div style="margin-bottom:12px;">${loanItemsHtml(loan)}</div>`:""}
        <div style="display:flex;justify-content:space-between;margin-bottom:12px;">
          <div><div style="font-size:10px;color:var(--ink3);font-family:monospace;margin-bottom:2px;">TOTAL</div><div style="font-size:16px;font-weight:700;">${fmtS(loan.amount)}</div></div>
          <div style="text-align:center;"><div style="font-size:10px;color:var(--ink3);font-family:monospace;margin-bottom:2px;">PAGADO</div><div style="font-size:16px;font-weight:700;color:var(--good);">${fmtS(loan.paid)}</div></div>
          <div style="text-align:right;"><div style="font-size:10px;color:var(--ink3);font-family:monospace;margin-bottom:2px;">PENDIENTE</div><div style="font-size:16px;font-weight:700;color:${color};">${fmtS(rem)}</div></div>
        </div>
        <div class="bar-wrap"><div class="bar" style="width:${pct}%;background:${color};box-shadow:0 0 8px color-mix(in srgb, ${color} 38%, transparent);"></div></div>
        <div class="row" style="margin-bottom:12px;">
          <span style="font-size:10px;color:var(--ink3);font-family:monospace;">${Math.round(pct)}% devuelto</span>
          ${loan.installments>1?`<span style="font-size:10px;color:var(--ink3);font-family:monospace;">Cuota: ${fmtS(cuota)}</span>`:""}
        </div>
        <div style="background:var(--inset);border-radius:10px;padding:12px;border:1px solid var(--line);">
          <div style="font-size:11px;color:var(--ink3);font-family:monospace;margin-bottom:8px;">REGISTRAR PAGO</div>
          <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
            ${loan.installments>1?`<button class="btn-sm" style="background:var(--surf-good);border:1px solid color-mix(in srgb, var(--good) 27%, transparent);color:var(--good);font-size:11px;" onclick="doLoanPay('${loan.id}',${Math.min(cuota,rem)})">+ Cuota (${fmtS(cuota)})</button>`:""}
            <button class="btn-sm" style="background:var(--surf-good);border:1px solid color-mix(in srgb, var(--good) 27%, transparent);color:var(--good);font-size:11px;" onclick="doLoanPay('${loan.id}',${rem})">Pagar todo (${fmtS(rem)})</button>
          </div>
          <div style="display:flex;gap:8px;">
            <input style="flex:1;margin-bottom:0;font-size:13px;" type="text" inputmode="numeric" placeholder="Otro monto…" value="${fmtInit(payAmounts[loan.id]||"")}" oninput="fmtAmountInput(this,v=>payAmounts['${loan.id}']=v)" id="pay-${loan.id}"/>
            <button class="btn-sm" style="background:var(--good);color:#fff;flex-shrink:0;" onclick="doLoanPayCustom('${loan.id}',${rem})">Pagar</button>
          </div>
        </div>
        ${(loan.payments||[]).length>0?`<div style="margin-top:12px;">
          <div style="font-size:10px;color:var(--ink3);font-family:monospace;margin-bottom:6px;">HISTORIAL DE PAGOS</div>
          ${(loan.payments||[]).slice().reverse().map(p=>`<div class="row" style="margin-bottom:4px;"><span style="font-size:11px;color:var(--ink2d);font-family:monospace;">${p.date}</span><span style="font-size:11px;color:var(--good);font-family:monospace;">+${fmt(p.amount)}</span></div>`).join("")}
        </div>`:""}
        <div style="margin-top:10px;display:flex;justify-content:flex-end;gap:14px;">
          <span style="font-size:11px;cursor:pointer;color:var(--pa);font-family:monospace;" onclick="doEditLoan('${loan.id}')">✏️ editar</span>
          <span style="font-size:11px;cursor:pointer;color:${confirmDelete&&confirmDelete.type==="loan"&&confirmDelete.id===loan.id?"var(--bad)":"var(--ink3)"};font-family:monospace;" onclick="doDeleteLoan('${loan.id}')">${confirmDelete&&confirmDelete.type==="loan"&&confirmDelete.id===loan.id?"¿Eliminar? Toca de nuevo":"🗑️ eliminar"}</span>
        </div>
      </div>`;}).join("")}
    ${settled.length>0?`<div class="card">
      <div class="ct">✓ Préstamos saldados</div>
      ${settled.map(l=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line);">
        <div><div style="font-size:13px;margin-bottom:2px;">${l.description}</div><div style="font-size:10px;color:var(--ink3);font-family:monospace;">${nm(l.from)} → ${nm(l.to)} · ${l.date}</div></div>
        <div style="text-align:right;"><div style="font-size:13px;color:var(--good);font-family:monospace;font-weight:600;">${fmt(l.amount)}</div><div style="font-size:10px;color:var(--good);">✓ saldado</div></div>
      </div>`).join("")}
    </div>`:""}
  </div>`;
}


// ── Cuentas por categoría ──────────────────────────────────────────────────
function renderCuentas(){
  const d=D();
  // New entries notification
  const currentCount=(d.entries||[]).length;
  const newCount=currentCount-lastSeenCount;
  const sp=d.split||{A:50,B:50};
  const spA=sp.A/100,spB=sp.B/100;
  const nA=d.names.A,nB=d.names.B;
  const allMonths=[...new Set((d.entries||[]).map(e=>e.date&&e.date.slice(0,7)).filter(Boolean))].sort().reverse();

  const entries=(d.entries||[]).filter(e=>{
    if(e.type!=="expense")return false;
    if(cuentasMonth!=="all"&&!(e.date&&e.date.startsWith(cuentasMonth)))return false;
    return true;
  });

  const bycat={};
  entries.forEach(e=>{
    if(!bycat[e.category])bycat[e.category]={cat:e.category,total:0,paidSharedByA:0,paidSharedByB:0,sharedTotal:0,ownA:0,ownB:0,entries:[]};
    const c=bycat[e.category];
    c.total+=e.amount;c.entries.push(e);
    if(e.user==="shared"){c.sharedTotal+=e.amount;if(e.paidBy==="A")c.paidSharedByA+=e.amount;else c.paidSharedByB+=e.amount;}
    else if(e.user==="A")c.ownA+=e.amount;
    else if(e.user==="B")c.ownB+=e.amount;
  });

  const cats=Object.values(bycat).sort((a,b)=>b.total-a.total);
  const grandTotal=cats.reduce((s,c)=>s+c.total,0);
  const grandShared=cats.reduce((s,c)=>s+c.sharedTotal,0);
  const grandOwn=cats.reduce((s,c)=>s+c.ownA+c.ownB,0);

  // Global balance on shared expenses
  const totalAPaid=cats.reduce((s,c)=>s+c.paidSharedByA,0);
  const totalBPaid=cats.reduce((s,c)=>s+c.paidSharedByB,0);
  const totalSharedAll=cats.reduce((s,c)=>s+c.sharedTotal,0);
  const globalBalA=totalAPaid-(totalSharedAll*spA); // positive = B owes A

  let html='<div class="sec">';

  // Month filter
  html+='<select style="margin-bottom:12px;" onchange="cuentasMonth=this.value;render()">';
  html+='<option value="all"'+(cuentasMonth==="all"?" selected":"")+'>Todos los meses</option>';
  allMonths.forEach(m=>{html+='<option value="'+m+'"'+(cuentasMonth===m?" selected":"")+'>'+m+'</option>';});
  html+='</select>';

  // Global summary card
  html+='<div class="card card-gold">';
  html+='<div class="ct">Resumen general'+(cuentasMonth!=="all"?" — "+cuentasMonth:"")+'</div>';
  html+='<div style="display:flex;justify-content:space-around;margin-bottom:12px;">';
  html+='<div style="text-align:center;"><div style="font-size:10px;color:var(--ink3);font-family:monospace;margin-bottom:3px;">TOTAL</div><div style="font-size:17px;font-weight:700;color:var(--gold);">'+fmtS(grandTotal)+'</div></div>';
  html+='<div style="width:1px;background:var(--line);"></div>';
  html+='<div style="text-align:center;"><div style="font-size:10px;color:var(--ink3);font-family:monospace;margin-bottom:3px;">COMPARTIDO</div><div style="font-size:17px;font-weight:700;color:var(--teal);">'+fmtS(grandShared)+'</div></div>';
  html+='<div style="width:1px;background:var(--line);"></div>';
  html+='<div style="text-align:center;"><div style="font-size:10px;color:var(--ink3);font-family:monospace;margin-bottom:3px;">PROPIOS</div><div style="font-size:17px;font-weight:700;color:var(--c-pink);">'+fmtS(grandOwn)+'</div></div>';
  html+='</div>';

  if(Math.abs(globalBalA)>1){
    const whoGlobal=globalBalA>0?(nB+' le debe a '+nA):(nA+' le debe a '+nB);
    const colorG=globalBalA>0?"var(--good)":"var(--gold)";
    html+='<div style="background:'+(globalBalA>0?"var(--surf-good)":"var(--surf-warn)")+';border:1px solid '+(globalBalA>0?"color-mix(in srgb, var(--good) 27%, transparent)":"color-mix(in srgb, var(--gold) 27%, transparent)")+';border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;">';
    html+='<div><div style="font-size:10px;color:var(--ink3);font-family:monospace;margin-bottom:2px;">BALANCE GLOBAL COMPARTIDOS</div>';
    html+='<div style="font-size:13px;color:'+colorG+';">'+whoGlobal+'</div></div>';
    html+='<div style="font-size:17px;font-weight:700;color:'+colorG+';font-family:monospace;">'+fmt(Math.abs(globalBalA))+'</div>';
    html+='</div>';
  }else{
    html+='<div style="font-size:13px;color:var(--good);text-align:center;padding:6px;">✅ Balance global al día</div>';
  }
  html+='</div>';

  if(cats.length===0){
    html+='<div style="text-align:center;color:var(--ink3);margin-top:40px;font-size:14px;">Sin gastos'+(cuentasMonth!=="all"?" este mes":"")+'</div>';
    html+='</div>';return html;
  }

  html+='<div style="font-size:10px;color:var(--ink3);font-family:monospace;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;">Por categoría — toca para ver detalle</div>';

  cats.forEach(c=>{
    const shouldA=c.sharedTotal*spA;
    const shouldB=c.sharedTotal*spB;
    const catBalA=c.paidSharedByA-shouldA;
    const hasImbalance=c.sharedTotal>0&&Math.abs(catBalA)>1;
    const whocat=catBalA>0?(nB+' le debe a '+nA):(nA+' le debe a '+nB);
    const catAmt=Math.abs(catBalA);
    const expanded=cuentasExpanded[c.cat];
    const color=c.sharedTotal>0?"var(--gold)":c.ownA>0&&c.ownB===0?"var(--pa)":c.ownB>0&&c.ownA===0?"var(--pb)":"var(--teal)";

    html+='<div class="card" style="margin-bottom:10px;">';

    // Header row - tappable
    html+='<div style="display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer;" onclick="cuentasExpanded[\''+c.cat.replace(/'/g,"\\'")+'\']=!cuentasExpanded[\''+c.cat.replace(/'/g,"\\'")+'\'];render()">';
    html+='<div style="flex:1;">';
    html+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><span style="font-size:20px;">'+icon(c.cat)+'</span><span style="font-size:15px;font-weight:700;">'+c.cat+'</span></div>';
    html+='<div style="display:flex;gap:6px;flex-wrap:wrap;">';
    if(c.sharedTotal>0)html+='<span class="tag" style="background:color-mix(in srgb, var(--gold) 9%, transparent);color:var(--gold);border:1px solid color-mix(in srgb, var(--gold) 20%, transparent);">compartido '+fmtS(c.sharedTotal)+'</span>';
    if(c.ownA>0)html+='<span class="tag" style="background:color-mix(in srgb, var(--pa) 9%, transparent);color:var(--pa);border:1px solid color-mix(in srgb, var(--pa) 20%, transparent);">'+nA+' '+fmtS(c.ownA)+'</span>';
    if(c.ownB>0)html+='<span class="tag" style="background:color-mix(in srgb, var(--pb) 9%, transparent);color:var(--pb);border:1px solid color-mix(in srgb, var(--pb) 20%, transparent);">'+nB+' '+fmtS(c.ownB)+'</span>';
    html+='</div></div>';
    html+='<div style="text-align:right;flex-shrink:0;margin-left:8px;">';
    html+='<div style="font-size:16px;font-weight:700;color:'+color+';">'+fmtS(c.total)+'</div>';
    html+='<div style="font-size:11px;color:var(--ink3);font-family:monospace;">'+c.entries.length+' reg.</div>';
    html+='<div style="font-size:13px;color:var(--ink3);margin-top:2px;">'+(expanded?'▲':'▼')+'</div>';
    html+='</div></div>';

    // Shared breakdown (always visible if has shared)
    if(c.sharedTotal>0){
      html+='<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);">';
      html+='<div style="font-size:10px;color:var(--ink3);font-family:monospace;margin-bottom:8px;">DESGLOSE COMPARTIDO — '+sp.A+'/'+sp.B+'</div>';
      html+='<div style="display:flex;justify-content:space-between;margin-bottom:8px;">';
      html+='<div style="text-align:center;flex:1;"><div style="font-size:10px;color:var(--ink3);font-family:monospace;margin-bottom:2px;">PAGÓ '+nA.toUpperCase()+'</div><div style="font-size:16px;font-weight:700;color:var(--pa);">'+fmt(c.paidSharedByA)+'</div><div style="font-size:10px;color:var(--ink3);font-family:monospace;">debía '+fmt(shouldA)+'</div></div>';
      html+='<div style="width:1px;background:var(--line);"></div>';
      html+='<div style="text-align:center;flex:1;"><div style="font-size:10px;color:var(--ink3);font-family:monospace;margin-bottom:2px;">TOTAL CAT.</div><div style="font-size:16px;font-weight:700;color:var(--gold);">'+fmt(c.sharedTotal)+'</div></div>';
      html+='<div style="width:1px;background:var(--line);"></div>';
      html+='<div style="text-align:center;flex:1;"><div style="font-size:10px;color:var(--ink3);font-family:monospace;margin-bottom:2px;">PAGÓ '+nB.toUpperCase()+'</div><div style="font-size:16px;font-weight:700;color:var(--pb);">'+fmt(c.paidSharedByB)+'</div><div style="font-size:10px;color:var(--ink3);font-family:monospace;">debía '+fmt(shouldB)+'</div></div>';
      html+='</div>';

      if(hasImbalance){
        const colorCat=catBalA>0?"var(--good)":"var(--gold)";
        const fromCat=catBalA>0?"B":"A";
        const toCat=catBalA>0?"A":"B";
        html+='<div style="background:'+(catBalA>0?"var(--surf-good)":"var(--surf-warn)")+';border:1px solid '+(catBalA>0?"color-mix(in srgb, var(--good) 27%, transparent)":"color-mix(in srgb, var(--gold) 27%, transparent)")+';border-radius:10px;padding:10px 12px;margin-bottom:8px;">';
        html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">';
        html+='<span style="font-size:12px;color:'+colorCat+';">'+whocat+'</span>';
        html+='<span style="font-size:16px;font-weight:700;color:'+colorCat+';font-family:monospace;">'+fmt(catAmt)+'</span>';
        html+='</div>';
        const safecat=encodeURIComponent(c.cat);
        html+='<button class="btn btn-green" style="margin-bottom:0;font-size:12px;padding:9px;" data-cat="'+safecat+'" data-am="'+catAmt+'" data-fr="'+fromCat+'" data-to="'+toCat+'" onclick="event.stopPropagation();doSaldarFromBtn(this)">✓ Registrar saldo de esta categoría</button>';
        html+='</div>';
      }else{
        html+='<div style="font-size:12px;color:var(--good);text-align:center;padding:6px;">✓ Al día en esta categoría</div>';
      }
      html+='</div>';
    }

    // Expanded: individual entries
    if(expanded){
      html+='<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);">';
      html+='<div style="font-size:10px;color:var(--ink3);font-family:monospace;margin-bottom:8px;">REGISTROS ('+c.entries.length+')</div>';
      c.entries.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(e=>{
        html+='<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid color-mix(in srgb, var(--line) 13%, transparent);align-items:center;">';
        html+='<div><div style="font-size:13px;margin-bottom:3px;">'+e.description+'</div>';
        html+='<div style="display:flex;gap:5px;flex-wrap:wrap;">';
        html+='<span class="tag" style="background:color-mix(in srgb, var(--violet) 9%, transparent);color:var(--ink2);border:1px solid color-mix(in srgb, var(--violet) 20%, transparent);">'+(e.user==="shared"?"compartido":"solo "+nm(e.user))+'</span>';
        if(e.paidBy)html+='<span class="tag" style="background:color-mix(in srgb, var(--pb) 9%, transparent);color:var(--pb);border:1px solid color-mix(in srgb, var(--pb) 20%, transparent);">pagó '+nm(e.paidBy)+'</span>';
        html+='<span style="font-size:10px;color:var(--ink3);font-family:monospace;">'+e.date+'</span>';
        html+='</div></div>';
        html+='<div style="text-align:right;flex-shrink:0;margin-left:8px;">';
        html+='<div style="font-size:14px;font-weight:700;font-family:monospace;">'+fmtS(e.amount)+'</div>';
        html+='<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:4px;flex-wrap:wrap;">';
        if(e.user==="shared"&&e.paidBy){
          const owedAmt=e.paidBy==="A"?Math.round(e.amount*spB):Math.round(e.amount*spA);
          if(owedAmt>0)html+='<span style="font-size:10px;cursor:pointer;color:var(--teal);border:1px solid color-mix(in srgb, var(--teal) 27%, transparent);padding:2px 7px;border-radius:6px;font-family:monospace;" onclick="event.stopPropagation();doSaldarEntry('+e.id+')">💳 saldar '+fmt(owedAmt)+'</span>';
        }
        html+='<span style="font-size:14px;cursor:pointer;" onclick="event.stopPropagation();doEditEntry('+e.id+')">✏️</span>';
        html+='<span style="font-size:'+(confirmDelete&&confirmDelete.type==="entry"&&confirmDelete.id===e.id?11:14)+'px;cursor:pointer;color:'+(confirmDelete&&confirmDelete.type==="entry"&&confirmDelete.id===e.id?"var(--bad)":"inherit")+';font-family:monospace;" onclick="event.stopPropagation();doDeleteEntry('+e.id+')">'+(confirmDelete&&confirmDelete.type==="entry"&&confirmDelete.id===e.id?"¿Seguro?":"🗑️")+'</span>';
        html+='</div></div>';
        html+='</div>';
      });
      // Cat settled history: legacy catSettled[] + new transfer entries for this category
      const catHistory=(d.catSettled||[]).filter(s=>s.cat===c.cat).map(s=>({date:s.date,paidBy:s.from,to:s.to,amount:s.amount}));
      const catTransfers=(d.entries||[]).filter(e=>e.type==="transfer"&&e.category===c.cat).map(e=>({date:e.date,paidBy:e.paidBy,to:e.paidBy==="A"?"B":"A",amount:e.amount}));
      const allSettled=[...catHistory,...catTransfers].sort((a,b)=>b.date.localeCompare(a.date));
      if(allSettled.length>0){
        html+='<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);">';
        html+='<div style="font-size:10px;color:var(--ink3);font-family:monospace;margin-bottom:6px;">SALDOS REGISTRADOS</div>';
        allSettled.forEach(s=>{
          html+='<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid color-mix(in srgb, var(--line) 13%, transparent);">';
          html+='<div><div style="font-size:12px;color:var(--good);">💳 '+nm(s.paidBy)+' → '+nm(s.to)+'</div>';
          html+='<div style="font-size:10px;color:var(--ink3);font-family:monospace;">'+s.date+'</div></div>';
          html+='<div style="font-size:13px;font-weight:700;color:var(--good);font-family:monospace;">'+fmt(s.amount)+'</div>';
          html+='</div>';
        });
        html+='</div>';
      }
      html+='</div>';
    }

    html+='</div>';
  });

  html+='</div>';
  return html;
}


// ── Gráficas ───────────────────────────────────────────────────────────────
function renderGraficas(){
  const d=D();
  const allMonths=[...new Set((d.entries||[]).map(e=>e.date&&e.date.slice(0,7)).filter(Boolean))].sort().reverse();
  const cm={};
  (d.entries||[]).filter(e=>e.type==="expense"&&(chartMonth==="all"||e.date&&e.date.startsWith(chartMonth))&&(chartUser==="all"||e.user===chartUser)).forEach(e=>{cm[e.category]=(cm[e.category]||0)+e.amount;});
  const cats=Object.entries(cm).sort(([,a],[,b])=>b-a);
  const total=cats.reduce((s,[,v])=>s+v,0);
  const ms={};
  (d.entries||[]).forEach(e=>{const m=e.date&&e.date.slice(0,7);if(!m)return;if(!ms[m])ms[m]={shared:0,A:0,B:0};if(e.type==="expense"){if(e.user==="shared")ms[m].shared+=e.amount;else if(e.user==="A")ms[m].A+=e.amount;else if(e.user==="B")ms[m].B+=e.amount;}});
  const months=Object.entries(ms).sort(([a],[b])=>a.localeCompare(b)).slice(-6);
  const allIncA=(d.entries||[]).filter(e=>e.type==="income"&&e.user==="A").reduce((s,e)=>s+e.amount,0);
  const allIncB=(d.entries||[]).filter(e=>e.type==="income"&&e.user==="B").reduce((s,e)=>s+e.amount,0);
  const allExpA=(d.entries||[]).filter(e=>e.type==="expense"&&e.user==="A").reduce((s,e)=>s+e.amount,0);
  const allExpB=(d.entries||[]).filter(e=>e.type==="expense"&&e.user==="B").reduce((s,e)=>s+e.amount,0);
  const allExpS=(d.entries||[]).filter(e=>e.type==="expense"&&e.user==="shared").reduce((s,e)=>s+e.amount,0);
  const spA=d.split.A/100,spB=d.split.B/100;
  const nA=allIncA-allExpA-allExpS*spA,nB=allIncB-allExpB-allExpS*spB;

  // Donut SVG
  let donutSvg="";
  if(cats.length>0&&total>0){
    let ang=-90;
    const R=60,r=35,cx=70,cy=70;
    const slices=cats.slice(0,8).map(([k,v],i)=>{
      const pct=v/total,a1=ang,a2=ang+pct*360;ang=a2;
      if(cats.length===1)return`<circle cx="${cx}" cy="${cy}" r="${R}" fill="${PAL[0]}" stroke="var(--card)" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--card)"/>`;
      const x1=cx+R*Math.cos(a1*Math.PI/180),y1=cy+R*Math.sin(a1*Math.PI/180);
      const x2=cx+R*Math.cos(a2*Math.PI/180),y2=cy+R*Math.sin(a2*Math.PI/180);
      const xi1=cx+r*Math.cos(a1*Math.PI/180),yi1=cy+r*Math.sin(a1*Math.PI/180);
      const xi2=cx+r*Math.cos(a2*Math.PI/180),yi2=cy+r*Math.sin(a2*Math.PI/180);
      const lg=pct>0.5?1:0;
      return`<path d="M${xi1},${yi1} L${x1},${y1} A${R},${R} 0 ${lg},1 ${x2},${y2} L${xi2},${yi2} A${r},${r} 0 ${lg},0,${xi1},${yi1} Z" fill="${PAL[i%PAL.length]}" stroke="var(--card)" stroke-width="1.5"/>`;
    });
    donutSvg=`<svg width="140" height="140" viewBox="0 0 140 140">${slices.join("")}<text x="70" y="66" text-anchor="middle" fill="var(--ink)" font-size="10" font-family="monospace">Total</text><text x="70" y="80" text-anchor="middle" fill="var(--gold)" font-size="10" font-family="monospace">${fmtS(total)}</text></svg>`;
  }

  return`<div class="sec">
    <div class="card">
      <div class="ct">Gastos por categoría</div>
      <div class="chips">
        ${[["all","Todos"],["A",d.names.A],["B",d.names.B],["shared","Compartido"]].map(([v,l])=>`<div class="chip${chartUser===v?" on":""}" onclick="chartUser='${v}';render()">${l}</div>`).join("")}
      </div>
      <select style="margin-bottom:14px;" onchange="chartMonth=this.value;render()">
        <option value="all"${chartMonth==="all"?" selected":""}>Todos los meses</option>
        ${allMonths.map(m=>`<option value="${m}"${chartMonth===m?" selected":""}>${m}</option>`).join("")}
      </select>
      ${cats.length>0?`<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;">
        ${donutSvg}
        <div style="flex:1;min-width:120px;">
          ${cats.slice(0,7).map(([k,v],i)=>`<div style="display:flex;align-items:center;gap:7px;margin-bottom:7px;">
            <div style="width:8px;height:8px;border-radius:2px;background:${PAL[i%PAL.length]};flex-shrink:0;"></div>
            <div style="flex:1;font-size:11px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${icon(k)} ${k}</div>
            <div style="font-size:11px;font-family:monospace;flex-shrink:0;">${fmtS(v)}</div>
          </div>`).join("")}
        </div>
      </div>`:`<div style="text-align:center;color:var(--ink3);font-size:12px;padding:20px;">Sin datos este período</div>`}
    </div>
    ${months.length>1?`<div class="card">
      <div class="ct">Evolución mensual</div>
      ${months.map(([m,v])=>`<div style="margin-bottom:12px;">
        <div class="row" style="margin-bottom:4px;"><span style="font-size:12px;font-family:monospace;color:var(--ink2);">${m}</span><span style="font-size:12px;font-family:monospace;font-weight:600;">${fmtS(v.shared+v.A+v.B)}</span></div>
        <div style="display:flex;height:10px;border-radius:5px;overflow:hidden;gap:1px;">
          ${v.shared>0?`<div style="flex:${v.shared};background:var(--gold);"></div>`:""}
          ${v.A>0?`<div style="flex:${v.A};background:var(--pa);"></div>`:""}
          ${v.B>0?`<div style="flex:${v.B};background:var(--pb);"></div>`:""}
        </div>
        <div style="display:flex;gap:10px;margin-top:4px;">
          <span style="font-size:9px;color:var(--gold);font-family:monospace;">■ ${fmtS(v.shared)}</span>
          <span style="font-size:9px;color:var(--pa);font-family:monospace;">■ ${d.names.A} ${fmtS(v.A)}</span>
          <span style="font-size:9px;color:var(--pb);font-family:monospace;">■ ${d.names.B} ${fmtS(v.B)}</span>
        </div>
      </div>`).join("")}
    </div>`:""}
    <div class="card">
      <div class="ct">Proyección de ahorro</div>
      <div class="row"><span class="lbl">Flujo ${d.names.A}/mes</span><span class="val" style="color:${nA>=0?"var(--good)":"var(--bad)"};">${fmt(nA)}</span></div>
      <div class="row"><span class="lbl">Flujo ${d.names.B}/mes</span><span class="val" style="color:${nB>=0?"var(--good)":"var(--bad)"};">${fmt(nB)}</span></div>
      <div class="div"></div>
      ${[3,6,12].map(m=>`<div class="row"><span class="lbl">En ${m} meses</span><span style="font-size:18px;font-weight:700;color:var(--gold);">${fmtS((nA+nB)*m)}</span></div>`).join("")}
    </div>
  </div>`;
}

// ── Ajustes ────────────────────────────────────────────────────────────────

        <div style="text-align:center;"><div style="font-size:36px;font-weight:700;color:var(--pb);" id="split-b-lbl">${d.split.B}%</div><div style="font-size:12px;color:var(--ink3);">${d.names.B}</div></div>

    ${settingsTab==="cats"?`<div>

          <div class="chip${newCat.type==="personal"?" on":""}" onclick="newCat.type='personal';render()">Personal</div>

      ${[["shared","Compartidas"],["personal","Personales"]].map(([type,lbl])=>`<div class="card">
        <div class="ct">${lbl}</div>
        ${(d.cats[type]||[]).map((c,idx)=>{
          const isEd=editCatIdx&&editCatIdx.type===type&&editCatIdx.idx===idx;
          if(isEd)return`<div class="ie-row"><input id="edit-cat-inp" type="text" value="${editCatVal.replace(/"/g,"&quot;")}" oninput="editCatVal=this.value"/><button class="btn-sm" style="background:var(--good);color:#fff;" onclick="doSaveCat()">✓</button><button class="btn-sm" style="background:var(--line);color:var(--ink);" onclick="editCatIdx=null;render()">✕</button></div>`;

          <label class="fl" style="margin-top:8px;">Actualizar ahorrado</label>

          ${[...(d.cats.shared||[]),...(d.cats.personal||[])].map(c=>`<option value="${c}"${newBudget.category===c?" selected":""}>${icon(c)} ${c}</option>`).join("")}
        </select>
        <label class="fl">Límite mensual (COP)</label>
        <input class="inp-big" id="budget-amt" type="text" inputmode="numeric" placeholder="$ 0" value="${fmtInit(newBudget.amount)}" oninput="fmtAmountInput(this,v=>newBudget.amount=v)"/>
        <button class="btn" onclick="doAddBudget()">+ Guardar presupuesto</button>
      </div>
      ${Object.entries(d.budgets||{}).length>0?`<div class="card">
        <div class="ct">Presupuestos activos</div>
        ${Object.entries(d.budgets||{}).map(([cat,lim])=>{
          const tm2=thisMonth();
          const me2=(d.entries||[]).filter(e=>e.date&&e.date.startsWith(tm2));

          const pct=Math.min(100,sp2/lim*100);
          const color=pct>=100?"var(--bad)":pct>=70?"var(--gold)":"var(--good)";
          return`<div style="margin-bottom:14px;">
            <div class="row"><span style="font-size:13px;">${icon(cat)} ${cat}</span><div style="display:flex;gap:10px;align-items:center;"><span style="font-size:11px;color:${color};font-family:monospace;">${fmt(sp2)}/${fmt(lim)}</span><span style="font-size:13px;cursor:pointer;" onclick="doEditBudget('${cat.replace(/'/g,"\\'")}',${lim})">✏️</span><span style="font-size:14px;cursor:pointer;" onclick="doDeleteBudget('${cat.replace(/'/g,"\\'")}')">🗑️</span></div></div>
            <div class="bar-wrap"><div class="bar" style="width:${pct}%;background:${color};box-shadow:0 0 6px color-mix(in srgb, ${color} 38%, transparent);"></div></div>

    ${settingsTab==="deudas"?`<div>
      ${((d.entries||[]).filter(e=>e.type==="debt")).length===0?`<div style="color:var(--ink3);text-align:center;margin-top:60px;font-size:14px;">Sin deudas 🎉</div>`:
      (d.entries||[]).filter(e=>e.type==="debt").map(debt=>{
        const start=new Date(debt.debtStart||debt.date),now=new Date();
        const passed=Math.max(0,(now.getFullYear()-start.getFullYear())*12+now.getMonth()-start.getMonth());
        const remaining=Math.max(0,(debt.debtMonths||1)-passed);
        const monthly=debt.amount/(debt.debtMonths||1);
        const pct=Math.min(100,passed/(debt.debtMonths||1)*100);
        const spA2=d.split.A/100,spB2=d.split.B/100;
        const color=debt.user==="shared"?"var(--gold)":debt.user==="A"?"var(--pa)":"var(--pb)";
        return`<div class="card">

const MESES_CORTOS={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,oct:10,nov:11,dic:12};
const IMP_MONEY="-?\\$ ?-?[\\d.,]+";
function impAmount(s){
  const str=String(s||"");const neg=str.indexOf("-")>=0;
  const n=Math.round(Number(str.replace(/[^\d,]/g,"").replace(",",".")))||0;

function impDate(dd,mm,yyyy){return yyyy+"-"+mm+"-"+dd;}
function impPeriod(text){
  const m=String(text).match(/(\d{1,2}) (ene|feb|mar|abr|may|jun|jul|ago|sep|oct|nov|dic)\.? (\d{4}) al (\d{1,2}) (ene|feb|mar|abr|may|jun|jul|ago|sep|oct|nov|dic)\.? (\d{4})/i);
  if(!m)return null;
  const f=(d,mo,y)=>y+"-"+String(MESES_CORTOS[mo.toLowerCase()]).padStart(2,"0")+"-"+String(d).padStart(2,"0");
  return{from:f(m[1],m[2],m[3]),to:f(m[4],m[5],m[6])};

const DAVI_SECTIONS=[["Tus pagos y abonos","pago"],["Transacciones del periodo facturado","periodo"],["Otros cargos","otros"],["Transacciones de periodos anteriores","anterior"],["Para pagar tu tarjeta usa alguno de estos canales",null]];
const DAVI_TX=new RegExp("^(\\d{2})/(\\d{2})/(\\d{4}) (?:(\\d{4,8}) )?(.+?) ("+IMP_MONEY+") (\\d+)/(\\d+) "+IMP_MONEY+" "+IMP_MONEY+"(?: [\\d,]+% [\\d,]+%)?$");
const DAVI_PAGO=new RegExp("^(\\d{2})/(\\d{2})/(\\d{4}) (.+?)((?: "+IMP_MONEY+"){2,})$");

function parseDavibank(lines){
  const out={bank:"davibank",label:"Davibank",period:null,declaredTotal:null,rows:[]};
  let sec=null,prev=null,interes=0;
  lines.forEach(l=>{
    const t=l.text;
    if(!out.period&&t.indexOf(" al ")>=0){const p=impPeriod(t);if(p)out.period=p;}
    let m=t.match(new RegExp("Valor transacciones del periodo ("+IMP_MONEY+")"));
    if(m&&out.declaredTotal===null)out.declaredTotal=impAmount(m[1]);
    m=t.match(new RegExp("^\\+ Intereses corrientes .*?("+IMP_MONEY+")$"));
    if(m)interes=impAmount(m[1]);
    const h=DAVI_SECTIONS.find(s=>t===s[0]||t.indexOf(s[0]+" ")===0);
    if(h){sec=h[1];prev=null;return;}
    if(!sec)return;
    if(sec==="pago"){
      m=t.match(DAVI_PAGO);
      if(m){const a=m[5].match(new RegExp(IMP_MONEY,"g"));out.rows.push({section:"pago",date:impDate(m[1],m[2],m[3]),ref:"",desc:m[4].trim(),amount:impAmount(a[a.length-1]),cuotaN:1,cuotaOf:1});}
      prev=null;return;
    }
    if(sec==="otros"){
      m=t.match(DAVI_OTRO);
      if(m)out.rows.push({section:"otros",date:impDate(m[1],m[2],m[3]),ref:"",desc:m[4].trim(),amount:impAmount(m[5]),cuotaN:1,cuotaOf:1});
      prev=null;return;
    }
    m=t.match(DAVI_TX);
    if(m){
      const row={section:sec,date:impDate(m[1],m[2],m[3]),ref:m[4]||"",desc:m[5].trim(),amount:impAmount(m[6]),cuotaN:Number(m[7]),cuotaOf:Number(m[8])};
      const di=l.items.find(i=>{const s=i.str.trim();return s&&!/^\d{2}\/\d{2}\/\d{4}$/.test(s)&&s!==row.ref;});
      out.rows.push(row);prev={row,page:l.page,y:l.y,x:di?di.x:null};return;
    }
    // Descripción partida: una sola pieza, justo debajo de la fila y alineada con su descripción.
    const parts=l.items.filter(i=>i.str.trim());
    const gap=prev?prev.y-l.y:99;
    if(prev&&parts.length===1&&l.page===prev.page&&gap>0&&gap<=11&&prev.x!==null&&Math.abs(parts[0].x-prev.x)<=4&&t.indexOf("$")<0){
      prev.row.desc+=" "+t;prev.y=l.y;return;
    }
    prev=null;
  });
  if(interes>0)out.rows.push({section:"interes",date:out.period?out.period.to:"",ref:"INT",desc:"Intereses corrientes",amount:interes,cuotaN:1,cuotaOf:1});
  return out;
}
const IMPORT_BANKS=[

];

function daysApart(a,b){return Math.abs(Date.parse(a)-Date.parse(b))/864e5;}
function findDuplicate(row,d){

const IMPORT_KEYWORDS=[
  [/\b(JUMBO|EXITO|CARULLA|OLIMPICA|D1|ARA|ISIMO|VAQUITA|SUPERMERCAD\w*|MERCADO|MAKRO|PRICESMART|ALKOSTO)\b/,"Mercado","Otro personal"],
  [/\b(FARMA\w*|DROG\w*|CRUZ VERDE|LOCATEL)\b/,"Otro compartido","Salud"],
  [/\b(EDS|TERPEL|PRIMAX|BIOMAX|UBER|CABIFY|PEAJE\w*|PARQUEADERO|PARKING)\b|^(DLO\W*)?DIDI$/,"Otro compartido","Transporte"],
  [/\b(MULTIPLEX|CINE\w*|PROCINAL|NETFLIX|SPOTIFY|HBO\w*|HELPHBOMAXCOM|DISNEY|STEAM|PLAYSTATION|XBOX|MICROSOFT\w*|ENTRETENIMIENTO)\b/,"Otro compartido","Entretenimiento"],
  [/\b(EPM|CLARO|MOVISTAR|TIGO|UNE|ETB|INTERNET)\b/,"Servicios","Otro personal"],
  [/\b(SEGURO|INTERESES|CUOTA DE MANEJO)\b/,"Deuda banco","Deuda personal"]

function catListFor(d,dec){const c=d.cats||{};return dec==="shared"?(c.shared||[]):(c.personal||[]);}
function suggestCategory(desc,dec,d){
  const list=catListFor(d,dec);
  const rule=(d.importRules||{})[merchantKey(desc)];
  if(rule&&rule.decision===dec&&list.indexOf(rule.category)>=0)return rule.category;
  const up=impUpper(desc);
  for(const [re,sh,pe] of IMPORT_KEYWORDS){
    if(re.test(up)){const c=dec==="shared"?sh:pe;if(list.indexOf(c)>=0)return c;break;}

function classifyImport(parsed,d){
  const done=new Set((d.entries||[]).map(e=>e.importKey).filter(Boolean));
  const skipped=new Set(d.importSkipped||[]);
  const seen={},cards=[],discarded=[];
  let computed=0;
  parsed.rows.forEach(r=>{
    if(r.section==="periodo"||(r.section==="anterior"&&r.cuotaOf===1))computed+=r.amount;
    let key=importKey(parsed.bank,r);
    seen[key]=(seen[key]||0)+1;
    if(seen[key]>1)key+="#"+seen[key];
    const item={...r,key,merchant:merchantKey(r.desc)};
    let reason="";
    if(r.section==="pago")reason="Pago o abono a la tarjeta";
    else if(/^KTAL PAGO ALTERNO/i.test(r.desc))reason="Traslado del pago mínimo alterno (no es una compra)";
    else if(r.section==="anterior"&&r.cuotaOf>1)reason="Compra a cuotas de un periodo anterior (ya facturada)";
    else if(r.amount<=0)reason="Valor negativo o en cero (reverso o ajuste)";
    else if(done.has(key))reason="Ya importada antes";
    else if(skipped.has(key))reason="Ya la marcaste como no registrar";
    if(reason)discarded.push({...item,reason});

}

const PDFJS_BASE="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
const PDFJS_SRI={
  lib:"sha512-q+4liFwdPC/bNdhUpZx6aXDx/h77yEQtn4I1slHydcbZK34nLaR3cAeYSJshoxIOq3mjEf7xJE8YWIUHMn+oCQ==",
  worker:"sha512-BbrZ76UNZq5BhH7LL7pn9A4TKQpQeNCHOo65/akfelcIBbcVvYWOFQKPXIrykE3qZxYjmDX573oa4Ywsc7rpTw=="
};
let pdfjsPromise=null;
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  if(pdfjsPromise)return pdfjsPromise;
  pdfjsPromise=(async()=>{
    await new Promise((ok,ko)=>{
      const s=document.createElement("script");
      s.src=PDFJS_BASE+"pdf.min.js";s.integrity=PDFJS_SRI.lib;s.crossOrigin="anonymous";
      s.onload=ok;s.onerror=()=>ko(new Error("PDFJS_LOAD"));
      document.head.appendChild(s);
    });
    const r=await fetch(PDFJS_BASE+"pdf.worker.min.js",{integrity:PDFJS_SRI.worker});
    if(!r.ok)throw new Error("PDFJS_LOAD");
    const url=URL.createObjectURL(new Blob([await r.text()],{type:"text/javascript"}));
    window.pdfjsLib.GlobalWorkerOptions.workerSrc=url;
    return window.pdfjsLib;
  })().catch(()=>{pdfjsPromise=null;throw new Error("PDFJS_LOAD");});
  return pdfjsPromise;
}
// Texto del PDF agrupado en líneas: piezas a ±2 puntos de altura forman una línea, de izquierda a derecha.
async function pdfToLines(file,password){
  const lib=await loadPdfJs();
  const data=new Uint8Array(await file.arrayBuffer());
  const doc=await lib.getDocument({data,password:password||undefined}).promise;
  const lines=[];
  for(let p=1;p<=doc.numPages;p++){
    const tc=await (await doc.getPage(p)).getTextContent();
    const pg=[];
    tc.items.forEach(it=>{
      const str=it.str||"";if(!str.trim())return;
      const x=it.transform[4],y=it.transform[5];
      let ln=pg.find(l=>Math.abs(l.y-y)<=2);
      if(!ln){ln={page:p,y,items:[]};pg.push(ln);}
      ln.items.push({x,str});
    });
    pg.sort((a,b)=>b.y-a.y);
    pg.forEach(l=>{l.items.sort((a,b)=>a.x-b.x);l.text=l.items.map(i=>i.str.trim()).filter(Boolean).join(" ");lines.push(l);});
  }
  try{doc.destroy();}catch(e){}
  return lines;
}

  });

// Abono dirigido exclusivamente al préstamo (NUNCA escribe una transfer de gastos).
async function doAbonoPrestamo(){
  const amt=Number(abonoAmt);
  if(!amt||amt<=0){showToast("⚠️ Ingresa un monto válido");return;}
  const d=D();
  let remaining=amt;
  const payEntries=[];
  const nl=(d.loans||[]).map(l=>{
    if(l.status!=="active"||remaining<=0.5||(abonoLoanId&&l.id!==abonoLoanId))return l;
    const pend=l.amount-l.paid;
    const pay=Math.min(pend,remaining);
    if(pay<=0)return l;
    remaining-=pay;
    const newPaid=l.paid+pay;
    payEntries.push({id:Date.now()+payEntries.length,type:"loan_payment",user:l.to,category:"Préstamos",description:"Pago: "+l.description,amount:pay,paidBy:l.to,note:abonoNote||null,date:today(),registeredBy:l.to,loanId:l.id});
    return{...l,paid:newPaid,payments:[...(l.payments||[]),{date:today(),amount:pay}],status:newPaid>=l.amount?"settled":"active"};
  });
  if(payEntries.length===0){showToast("⚠️ No hay préstamo activo pendiente");return;}
  const applied=amt-Math.max(0,remaining);
  await persist({...d,loans:nl,entries:[...(d.entries||[]),...payEntries]});
  showAbonoForm=false;abonoLoanId=null;abonoAmt="";abonoNote="";abonoFrom="";abonoTarget="";
  showToast("✓ "+fmt(applied)+" aplicado al préstamo"+(remaining>0.5?" (sobraron "+fmt(remaining)+")":""));
}

// Reconcilia AMBOS ledgers de una sola vez: registra la transfer de gastos Y el pago del
// préstamo en un único persist, cada uno con su propio pagador correcto (pueden ser
// direcciones opuestas — por eso nunca se mezclan en un solo monto/pagador).
async function doReconcileTodo(){
  const d=D();
  const balA=computeBalance(d);
  const activeLoans=(d.loans||[]).filter(l=>l.status==="active");
  const netLoanA=activeLoans.reduce((s,l)=>l.from==="A"?s+(l.amount-l.paid):s-(l.amount-l.paid),0);
  if(Math.abs(balA)<1&&Math.abs(netLoanA)<1){showToast("Ya están al día");return;}
  const newEntries=[];
  let newLoans=d.loans||[];
  if(Math.abs(balA)>1){
    const payer=balA>0?"B":"A";const receiver=payer==="A"?"B":"A";
    newEntries.push({id:Date.now(),type:"transfer",user:"shared",paidBy:payer,amount:Math.round(Math.abs(balA)),description:"Abono de "+nm(payer)+" a "+nm(receiver),category:"Abono",note:abonoNote||null,date:today(),registeredBy:payer});
  }
  if(Math.abs(netLoanA)>1){
    let remaining=Math.abs(netLoanA);
    newLoans=(d.loans||[]).map(l=>{
      if(l.status!=="active"||remaining<=0.5)return l;
      const pend=l.amount-l.paid;const pay=Math.min(pend,remaining);
      if(pay<=0)return l;
      remaining-=pay;const newPaid=l.paid+pay;
      newEntries.push({id:Date.now()+newEntries.length+1,type:"loan_payment",user:l.to,category:"Préstamos",description:"Pago: "+l.description,amount:pay,paidBy:l.to,note:"Reconciliado con balance",date:today(),registeredBy:l.to,loanId:l.id});
      return{...l,paid:newPaid,payments:[...(l.payments||[]),{date:today(),amount:pay}],status:newPaid>=l.amount?"settled":"active"};
    });
  }
  await persist({...d,loans:newLoans,entries:[...(d.entries||[]),...newEntries]});
  showAbonoForm=false;abonoLoanId=null;abonoAmt="";abonoNote="";abonoFrom="";abonoTarget="";
  showToast("✓ Reconciliado — gastos y préstamo saldados");
}

// ═══ RECURRENTES CON FECHA ═══
// Ingresos: se registran solos (quincenal 15 y 30, o una vez al mes en su día).
// Pagos (gastos y cuotas): desde su día sale "¿Ya registraste o pagaste esto?".
// Anuales (freq:"yearly", month, day): cuentan solo en su mes; el aviso sale 7 días antes.
const REC_AUTO_FROM="2026-11-08"; // ingresos anteriores a esta fecha no se registran solos
const REC_WARN_YEARLY=7;
function isoDay(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");}
function dayAdd(ds,n){const t=new Date(ds+"T12:00:00");t.setDate(t.getDate()+n);return isoDay(t);}
function lastDayOf(mk){return new Date(Number(mk.slice(0,4)),Number(mk.slice(5,7)),0).getDate();}
// Día del mes sin pasarse del último (30 en febrero → 28 o 29).
function mkDay(mk,day){return mk+"-"+String(Math.min(Math.max(1,Number(day)||1),lastDayOf(mk))).padStart(2,"0");}
function dayLabel(ds){return Number(ds.slice(8))+" "+MO_ES[Number(ds.slice(5,7))-1];}
function isYearly(r){return r.freq==="yearly"&&r.type!=="income";}
// ¿Cuenta este recurrente en el mes mk? Los anuales solo en su mes.
function recInMonth(r,mk){return !isYearly(r)||Number(mk.slice(5,7))===Number(r.month);}
// Valor del recurrente en el mes (con su ajuste si existe). Deuda a cuotas: la cuota, o 0 fuera de plazo.
function recMonthAmount(r,mk){
  const ov=(r.overrides&&r.overrides[mk]!=null)?r.overrides[mk]:null;
  if(r.type==="debt"&&(r.debtMonths||0)>1){
    const el=moElapsed((r.debtStart||mk).slice(0,7),mk);
    if(el<0||el>=r.debtMonths)return 0;
    return ovTotal(ov,Math.round(r.amount/r.debtMonths));
  }
  return ovTotal(ov,Number(r.amount)||0);
}
// Pagos de un ingreso en el mes: quincenal (mitad el 15, mitad el 30) o uno en su día.
function incomeSlots(r,mk){
  const total=recMonthAmount(r,mk);
  if(r.pay==="monthly")return[{slot:"m",date:mkDay(mk,r.day||30),amount:total}];
  const half=Math.round(total/2);
  return[{slot:"q1",date:mkDay(mk,15),amount:half},{slot:"q2",date:mkDay(mk,30),amount:total-half}];
}
const SLOT_TXT={q1:"1.ª quincena",q2:"2.ª quincena",m:"pago del mes"};
function recWhen(r){
  if(r.type==="income")return r.pay==="monthly"?"Cada mes · día "+(r.day||30):"Quincenal · 15 y 30";
  if(isYearly(r))return r.month&&r.day?"Cada año · "+r.day+" "+MO_ES[r.month-1]:"Cada año · sin fecha";
  return r.day?"Cada mes · día "+r.day:"Cada mes · sin día de pago";
}
function normDesc(s){return String(s||"").trim().toLowerCase();}
// Ingresos que ya deberían estar registrados y no lo están (hasta el día `now`).
function autoIncomeEntries(d,now){
  const done=d.recDone||[];const out=[];const mk=now.slice(0,7);
  const seen=(d.entries||[]).concat(d.trash||[]);
  // id único aunque haya otros registros creados en el mismo milisegundo
  let nextId=Math.max(Date.now(),(d.entries||[]).reduce((m,e)=>Math.max(m,Number(e.id)||0),0)+1);
  (d.recurring||[]).filter(r=>r.type==="income").forEach(r=>{
    const u=r.user==="A"?"A":"B";
    [moAdd(mk,-1),mk].forEach(m=>incomeSlots(r,m).forEach(s=>{
      const key="inc|"+r.id+"|"+m+"|"+s.slot;
      if(s.date>now||s.date<REC_AUTO_FROM||s.amount<=0||done.indexOf(key)>=0)return;
      if(seen.some(e=>e.autoKey===key))return;
      // Ya lo registraron a mano: mismo ingreso de la misma persona a ±5 días.
      const lo=dayAdd(s.date,-5),hi=dayAdd(s.date,5);
      if((d.entries||[]).some(e=>e.type==="income"&&!e.autoKey&&e.user===u&&normDesc(e.description)===normDesc(r.description)&&e.date>=lo&&e.date<=hi))return;
      out.push({id:nextId++,date:s.date,type:"income",user:u,category:r.category,description:r.description,amount:s.amount,
        incomeSource:r.incomeSource||"nomina",registeredBy:u,isRecurring:false,recId:r.id,autoKey:key,note:"Registrado solo · "+SLOT_TXT[s.slot]});
    }));
  });
  return out;
}
let autoIncBusy=false;
async function runAutoIncomes(now){
  if(autoIncBusy||saving||!localData)return;
  const d=D();const add=autoIncomeEntries(d,now||today());
  if(!add.length)return;
  autoIncBusy=true;
  try{
    await persist({...d,entries:[...(d.entries||[]),...add]});
    showToast("💰 Se registró solo: "+add.map(e=>escH(e.description)+" "+fmt(e.amount)).join(" · "));
  }finally{autoIncBusy=false;}
}
// Cuándo toca un pago y en qué ventana se busca si ya se registró.
function recDue(r,now){
  if(r.type==="income")return null;
  if(isYearly(r)){
    if(!r.month||!r.day)return null;
    const at=y=>mkDay(y+"-"+String(r.month).padStart(2,"0"),r.day);
    let y=Number(now.slice(0,4));let due=at(y);
    if(dayAdd(due,60)<now){y++;due=at(y);}
    return{key:r.id+"|"+y,due,from:dayAdd(due,-REC_WARN_YEARLY),lo:dayAdd(due,-45),hi:dayAdd(due,60),amount:recMonthAmount(r,due.slice(0,7))};
  }
  if(!r.day)return null;
  const mk=now.slice(0,7);const due=mkDay(mk,r.day);
  return{key:r.id+"|"+mk,due,from:due,lo:mk+"-01",hi:mk+"-31",amount:recMonthAmount(r,mk)};
}
function recPaid(d,r,info){
  if((d.recDone||[]).indexOf(info.key)>=0)return true;
  const n=normDesc(r.description);
  return (d.entries||[]).some(e=>e.date&&e.date>=info.lo&&e.date<=info.hi&&(e.recId===r.id||
    (e.type==="expense"&&e.category===r.category&&(normDesc(e.description)===n||normDesc(e.description)==="cuota "+n))));
}
function pendingRecs(d,now){
  const out=[];
  (d.recurring||[]).forEach(r=>{
    const i=recDue(r,now);
    if(!i||i.amount<=0||now<i.from||recPaid(d,r,i))return;
    out.push({r,key:i.key,due:i.due,amount:i.amount});
  });
  return out.sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0);
}
async function doRecDone(key){
  const d=D();
  const done=(d.recDone||[]).filter(k=>k!==key).concat([key]).slice(-200);
  await persist({...d,recDone:done});
  showToast("✓ Listo, no te vuelvo a preguntar");
}
function renderRecDueCard(d){
  const now=today();const list=pendingRecs(d,now);
  if(!list.length)return"";
  const when=p=>{
    if(p.due===now)return"vence hoy";
    if(p.due>now){const n=Math.round((new Date(p.due+"T12:00:00")-new Date(now+"T12:00:00"))/864e5);return"vence el "+dayLabel(p.due)+" · en "+n+(n===1?" día":" días");}
    return"desde el "+dayLabel(p.due);
  };
  return`<div class="card card-warn">
    <div class="ct" style="color:var(--gold);">🔔 ¿Ya registraste o pagaste esto?</div>
    ${list.map(p=>`<div class="rec-due-row">
      <div style="flex:1;min-width:0;">
        <div style="font-size:13.5px;overflow-wrap:anywhere;">${icon(p.r.category)} ${escH(p.r.description)}</div>
        <div style="font-size:11px;color:var(--ink3);margin-top:2px;">${when(p)} · ${p.r.user==="shared"?"Compartido":escH(nm(p.r.user))}${isYearly(p.r)?" · anual":""}</div>

// "Flores 250000, Cabello 400.000" → [{name,amount}]. El valor al final es opcional.
function parseLoanItems(text){
  return String(text||"").split(/[\n,;]+/).map(p=>p.trim()).filter(Boolean).map(p=>{
    const m=p.match(/^(.*?)[\s:$]+([\d.]{4,})$/);
    return m?{name:m[1].trim(),amount:Number(m[2].replace(/\./g,""))}:{name:p};
  });
}

// Comprehensive human-readable report — for auditing anomalies, duplicates, misreads.
function doExportReport(){
  const d=D();
  const L=[];
  const money=n=>fmt(n||0);
  const E=d.entries||[];
  L.push(`# Informe financiero — ${d.names.A} & ${d.names.B}`);
  L.push(`Generado: ${today()} · División ${d.split.A}/${d.split.B}`);
  L.push("");
  // Balance summary
  const netA=computeBalance(d);
  const activeLoans=(d.loans||[]).filter(l=>l.status==="active");
  const netLoanA=activeLoans.reduce((s,l)=>l.from==="A"?s+(l.amount-l.paid):s-(l.amount-l.paid),0);
  L.push(`## Resumen de balance`);
  L.push(`- Gastos compartidos: ${Math.abs(netA)<1?"al día":(netA>0?d.names.B+" debe "+money(netA)+" a "+d.names.A:d.names.A+" debe "+money(-netA)+" a "+d.names.B)}`);
  L.push(`- Préstamos: ${Math.abs(netLoanA)<1?"al día":(netLoanA>0?d.names.B+" debe "+money(netLoanA)+" a "+d.names.A:d.names.A+" debe "+money(-netLoanA)+" a "+d.names.B)}`);
  L.push("");
  // Debts ledger
  const debts=E.filter(e=>e.type==="debt");
  L.push(`## Deudas y proyectos (${debts.length})`);
  debts.forEach(de=>{
    const pays=paymentsForDebt(d,de);
    const paid=pays.reduce((s,p)=>s+(p.amount||0),0);
    const pending=Math.max(0,de.amount-paid);
    const months=de.debtMonths||1;
    const paidA=de.user==="shared"?pays.filter(p=>p.paidBy==="A").reduce((s,p)=>s+p.amount,0):(de.user==="A"?paid:0);
    const paidB=de.user==="shared"?pays.filter(p=>p.paidBy==="B").reduce((s,p)=>s+p.amount,0):(de.user==="B"?paid:0);
    L.push(`### ${de.description} ${de.user==="shared"?"(compartida)":"("+nm(de.user)+")"}`);
    L.push(`- Total ${money(de.amount)} · Pagado ${money(paid)} · Pendiente ${money(pending)}${pending<1&&paid>0?" ✅ SALDADA":""}`);
    L.push(`- ${months>1?months+" cuotas (~"+money(Math.round(de.amount/months))+"/mes)":"pago único"} · inicio ${de.debtStart||de.date||"?"}`);
    L.push(`- Aporte: ${d.names.A} ${money(paidA)} · ${d.names.B} ${money(paidB)}`);
    pays.forEach(p=>L.push(`  - ${p.date} · ${money(p.amount)}${p.paidBy?" · "+nm(p.paidBy):""}${p.note?" · "+p.note:""}`));
    L.push("");
  });
  // Loans
  L.push(`## Préstamos (${(d.loans||[]).length})`);
  (d.loans||[]).forEach(l=>{
    L.push(`### ${l.description} · ${nm(l.from)} → ${nm(l.to)} [${l.status}]`);
    L.push(`- Total ${money(l.amount)} · Pagado ${money(l.paid)} · Pendiente ${money(l.amount-l.paid)} · ${l.installments||1} cuotas`);
    (l.payments||[]).forEach(p=>L.push(`  - ${p.date} · ${money(p.amount)}`));
    L.push("");
  });
  // Viajes
  L.push(`## Viajes (${(d.viajes||[]).length})`);
  (d.viajes||[]).forEach(v=>{
    const vIds=v.entries||[];
    const vE=E.filter(e=>e.type==="expense"&&(vIds.includes(e.id)||vIds.includes(Number(e.id))));
    const sh=vE.filter(e=>e.user==="shared").reduce((s,e)=>s+e.amount,0);
    L.push(`### ✈️ ${v.name} (${v.date}) — ${vE.length} gastos, total ${money(vE.reduce((s,e)=>s+e.amount,0))}, compartido ${money(sh)}`);
  });
  L.push("");
  // Recurring
  L.push(`## Recurrentes (${(d.recurring||[]).length})`);
  (d.recurring||[]).forEach(r=>{
    L.push(`- [${r.type}] ${r.description} · ${r.user==="shared"?"compartido":nm(r.user)} · ${money(r.amount)} · ${recWhen(r)}${r.debtMonths>1?" · "+r.debtMonths+" meses":""}${(r.overrides&&Object.keys(r.overrides).length)?" · "+Object.keys(r.overrides).length+" ajustes":""}`);
  });
  L.push("");
  L.push(`## Wishlist (${(d.wishlist||[]).length})`);
  (d.wishlist||[]).forEach(w=>L.push(`- [${w.status}] ${w.name} · ${w.kind} · ${money(w.price||0)}`));
  L.push("");
  // Anomaly checks
  L.push(`## ⚠️ Posibles anomalías`);
  const anomalies=[];
  E.filter(e=>e.type==="expense"&&e.user==="shared"&&!e.paidBy).forEach(e=>anomalies.push(`Gasto compartido sin pagador: "${e.description}" ${e.date} ${money(e.amount)}`));
  // Duplicates: same date+amount+description
  const seen={};
  E.forEach(e=>{const k=e.date+"|"+e.amount+"|"+e.description;if(seen[k])anomalies.push(`Posible duplicado: "${e.description}" ${e.date} ${money(e.amount)}`);seen[k]=true;});
  // Debt vs recurring name-match with divergent amounts/months
  debts.forEach(de=>{
    (d.recurring||[]).forEach(r=>{
      const nameMatch=(r.description||"").replace(/[^a-zA-Z0-9]/g,"").toLowerCase()===(de.description||"").replace(/[^a-zA-Z0-9]/g,"").toLowerCase();
      if(nameMatch&&(r.amount!==de.amount||r.debtMonths!==de.debtMonths))anomalies.push(`Deuda "${de.description}" difiere entre registro (${money(de.amount)}/${de.debtMonths}m) y recurrente (${money(r.amount)}/${r.debtMonths}m)`);
    });
  });
  // Future-dated debts
  debts.forEach(de=>{if((de.debtStart||"")>today())anomalies.push(`Deuda con fecha de inicio futura: "${de.description}" inicia ${de.debtStart}`);});
  // Overpaid debts
  debts.forEach(de=>{const paid=paymentsForDebt(d,de).reduce((s,p)=>s+p.amount,0);if(paid>de.amount+1)anomalies.push(`Deuda sobrepagada: "${de.description}" pagado ${money(paid)} > total ${money(de.amount)}`);});
  if(anomalies.length===0)L.push("- Ninguna detectada");
  else anomalies.forEach(a=>L.push(`- ${a}`));
  L.push("");
  // Full entries
  L.push(`## Todos los movimientos (${E.length})`);
  L.push("| Fecha | Tipo | Quién | Categoría | Descripción | Monto | Pagó |");
  L.push("|---|---|---|---|---|---|---|");
  [...E].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).forEach(e=>{
    L.push(`| ${e.date} | ${e.type} | ${nm(e.user)} | ${e.category||""} | ${(e.description||"").replace(/\|/g,"/")} | ${money(e.amount)} | ${e.paidBy?nm(e.paidBy):""} |`);
  });
  const md=L.join("\n");
  const a=document.createElement("a");a.href="data:text/markdown;charset=utf-8,"+encodeURIComponent(md);a.download=`informe-finanzas-${today()}.md`;a.click();
  if(navigator.clipboard)navigator.clipboard.writeText(md).then(()=>showToast("✓ Informe descargado y copiado")).catch(()=>showToast("✓ Informe descargado"));
  else showToast("✓ Informe descargado");
}

    html+=`<div style="text-align:center;color:var(--ink3);margin-top:30px;font-size:14px;"><div style="font-size:40px;margin-bottom:12px;">🗑️</div>Papelera vacía</div></div>`;

    const amt=(it.amount||it.price)?fmtS(it.amount||it.price):"";

  qpDebtId=null;qpDebtAmtA="";qpDebtAmtB="";qpDebtAccount="";
  await persist({...d,entries:[...(d.entries||[]),...newEntries]});

async function doPayCuotaFromProj(recId,amtA,amtB){
  const rid=Number(recId)||recId;
  const d=D();
  const r=(d.recurring||[]).find(x=>x.id===rid);

  const sp=d.split||{A:50,B:50};

  const dId=de?de.id:null;
  const newEntries=[];

    if(amtB>0)newEntries.push({id:Date.now()+1,date:today(),type:"expense",user:"shared",category:r.category,description:"Cuota "+r.description,amount:amtB,paidBy:"B",note:null,isRecurring:false,registeredBy:"B",debtId:dId});
  }else{
    const amt=amtA||amtB;
    if(amt>0)newEntries.push({id:Date.now(),date:today(),type:"expense",user:r.user,category:r.category,description:"Cuota "+r.description,amount:amt,paidBy:null,note:null,isRecurring:false,registeredBy:r.user,debtId:dId});
  }

  await persist({...d,entries:[...(d.entries||[]),...newEntries]});

  }else{
    showToast(`✓ Cuota ${fmt(total)} registrada`);
  }
}

const MO_ES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MO_LARGO=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function escH(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function moAdd(key,n){const dt=new Date(parseInt(key.slice(0,4)),parseInt(key.slice(5))-1+n,1);return moKey(dt.getFullYear(),dt.getMonth()+1);}
function moLabel(key){return MO_ES[parseInt(key.slice(5))-1]+" "+key.slice(0,4);}
function moLargo(key){return MO_LARGO[parseInt(key.slice(5))-1]+" "+key.slice(0,4);}
const WISH_GROUPS=["Temu"];
const fmtAx=n=>{const a=Math.abs(n),s=n<0?"-":"";if(a>=1000000)return s+"$"+(+(a/1000000).toFixed(1))+"M";if(a>=1000)return s+"$"+Math.round(a/1000)+"K";return s+"$"+Math.round(a);};

// Foto de un mes: lo que entra y lo que sale para los DOS, con las mismas reglas de buildProjection.
// - Las libranzas no suman a "sale": el ingreso registrado ya es neto. Se listan aparte en payroll.
// - Al terminar una libranza, ese descuento vuelve a la nómina como ingreso (released).
// - Por cobrar: intereses mensuales y capital en su fecha de pago.
function monthFlow(d,mk){
  const sp=d.split||{A:50,B:50};
  const incomes=[],outs=[],payroll=[],oneoffs=[];
  const covered=new Set((d.recurring||[]).filter(r=>r.type==="debt"&&(r.debtMonths||0)>1).map(r=>r.category+"|"+r.description));
  const parts=(user,amt,s)=>user==="shared"?{a:s.a,b:s.b}:{a:user==="A"?amt:0,b:user==="B"?amt:0};
  (d.recurring||[]).forEach(r=>{
    const ov=(r.overrides&&r.overrides[mk]!=null)?r.overrides[mk]:null;
    if(r.type==="income"){
      incomes.push({id:r.id,name:r.description||r.category,user:r.user==="A"?"A":"B",amount:ovTotal(ov,r.amount),kind:"income",editable:true,baseAmount:r.amount,isGross:!!r.isGross,sub:r.isGross?"bruto · neto pendiente":r.isEstimated?"neto estimado":""});
      return;
    }
    if(!recInMonth(r,mk))return;
    const isCuota=r.type==="debt"&&(r.debtMonths||0)>1;
    let base=r.amount;
    if(isCuota){
      const el=moElapsed((r.debtStart||mk).slice(0,7),mk);
      if(el<0||el>=r.debtMonths)return;
      base=Math.round(r.amount/r.debtMonths);
    }
    const amt=ovTotal(ov,base);
    const s=r.user==="shared"?recSplitForMonth(r,mk,base,sp):null;
    outs.push({id:r.id,name:r.description||r.category,user:r.user,amount:amt,kind:isCuota?"cuota":"fijo",editable:!isCuota,yearly:isYearly(r),sub:isYearly(r)?"pago anual":"",...parts(r.user,amt,s||{})});
  });
  (d.entries||[]).filter(e=>e.type==="debt"&&(e.debtMonths||0)>1&&!e.closed).forEach(e=>{
    const el=moElapsed((e.debtStart||e.date||mk).slice(0,7),mk);
    const monthly=minPaymentOf(d,e);
    if(e.autoPayroll){
      if(el>=0&&el<e.debtMonths)payroll.push({id:e.id,name:e.description,user:e.user,amount:monthly});
      else if(el>=e.debtMonths)incomes.push({id:"rel"+e.id,name:"Libranza liberada · "+e.description,user:e.user==="A"?"A":"B",amount:monthly,kind:"released"});
      return;
    }
    if(e.isRecurring||el<0||el>=e.debtMonths||covered.has(e.category+"|"+(e.description||"")))return;
    const a=e.user==="shared"?Math.round(monthly*sp.A/100):(e.user==="A"?monthly:0);
    outs.push({id:e.id,name:e.description,user:e.user,amount:monthly,kind:"cuota",editable:false,a,b:monthly-a});
  });
  ((d.juntos||{}).pagosPlaneados||[]).filter(p=>p.month===mk).forEach(p=>{
    const de=(d.entries||[]).find(e=>e.id===p.debtId);
    if(de&&paymentsForDebt(d,de).some(x=>(x.date||"").startsWith(mk)))return;
    const amt=de?Math.min(p.amount,pendingOf(d,de)):p.amount;
    if(amt>0)outs.push({id:p.id,name:p.name,user:p.user,amount:amt,kind:"plan",editable:false,a:p.user==="A"?amt:0,b:p.user==="B"?amt:0});
  });
  tercerosActive(d).filter(t=>t.kind!=="debt").forEach(t=>{
    const pend=terceroPending(t);if(pend<=0)return;
    const dueKey=t.dueDate?t.dueDate.slice(0,7):null;
    if(!dueKey||mk<=dueKey){
      const i=terceroMonthlyInterest(t);
      if(i>0)incomes.push({id:"int"+t.id,name:"Intereses · "+t.name,user:"B",amount:i,kind:"cobro"});
    }
    if(dueKey===mk)oneoffs.push({id:"cap"+t.id,name:"Capital · "+t.name,user:"B",amount:pend});
  });
  ((d.juntos||{}).primas||[]).filter(p=>p.only?p.only===mk:(p.months||[]).includes(mk.slice(5))).forEach(p=>oneoffs.push({id:p.id,name:p.name,user:p.user,amount:(p.overrides&&p.overrides[mk]!=null)?p.overrides[mk]:p.amount}));
  const sum=(l,f)=>l.reduce((s,x)=>s+(f?f(x):x.amount),0);
  const inRec=sum(incomes),inOne=sum(oneoffs),inTot=inRec+inOne;
  const outTot=sum(outs),cuotas=sum(outs.filter(x=>x.kind==="cuota")),planeado=sum(outs.filter(x=>x.kind==="plan")),fijos=outTot-cuotas-planeado;
  const recA=sum(incomes.filter(x=>x.user==="A"));
  const inA=recA+sum(oneoffs.filter(x=>x.user==="A")),inB=inTot-inA;
  const own=u=>sum(outs.filter(x=>x.user===u));
  const casa=casaReal(d,mk);
  const shOuts=outs.filter(x=>x.user==="shared"&&(!casa||x.kind!=="cuota"));
  const shA=sum(shOuts,x=>x.a)+(casa?casa.A:0),shB=sum(shOuts,x=>x.b)+(casa?casa.B:0);
  const extraPrimas=casa?casa.extra:0,extraA=casa?casa.extraA:0,extraB=casa?casa.extraB:0,extraFuente=casa?casa.fuente:"";
  return{key:mk,incomes,outs,payroll,oneoffs,inRec,inTot,outTot,cuotas,fijos,planeado,net:inTot-outTot,recA,inA,inB,ownA:own("A"),ownB:own("B"),shA,shB,extraPrimas,extraA,extraB,extraFuente,casaReal:!!casa,
    restA:inA-own("A")-shA-extraA,restB:inB-own("B")-shB-extraB,payrollTot:sum(payroll)};
}
function jointCurve(d,n){
  let s=Number((d.juntos||{}).saldoInicial)||0;
  const base=thisMonth(),rows=[];
  for(let i=0;i<n;i++){
    const key=moAdd(base,i);const f=monthFlow(d,key);
    s+=f.net;
    rows.push({key,in:f.inTot,out:f.outTot,net:f.net,saldo:s,flow:f});
  }
  return rows;
}
// ¿Cuándo alcanza cada cosa de la wishlist? Primero necesidades, en el orden en que se agregaron.
// Solo se compra en un mes si desde ahí en adelante nunca queda menos de un mes de gastos en la cuenta.
function wishPlan(d){
  const rows=jointCurve(d,36);
  const pend=(d.wishlist||[]).filter(w=>w.status!=="comprado");
  const ordered=[...pend.filter(w=>w.kind==="necesidad"),...pend.filter(w=>w.kind!=="necesidad")];
  const spent=rows.map(()=>0),eta={};
  ordered.forEach(w=>{
    const p=Number(w.price)||0;
    if(!p){eta[w.id]=null;return;}
    let found=-1;
    for(let i=0;i<rows.length&&found<0;i++){
      let ok=true;
      for(let j=i;j<rows.length;j++){if(rows[j].saldo-spent[j]-p<rows[j].out){ok=false;break;}}
      if(ok)found=i;
    }
    if(found<0){eta[w.id]=false;return;}
    for(let j=found;j<rows.length;j++)spent[j]+=p;
    eta[w.id]=rows[found].key;
  });
  return{rows,spent,eta};
}
// Hitos de la curva: cuotas altas, deudas que terminan y plata por cobrar.
function curveEvents(d,rows){
  const ev=[];const inRange=k=>rows.findIndex(r=>r.key===k);
  (d.recurring||[]).filter(r=>r.type==="debt"&&(r.debtMonths||0)>1).forEach(r=>{
    const vals=Object.values(r.overrides||{}).map(o=>ovTotal(o,0)).sort((a,b)=>a-b);
    const med=vals.length?vals[Math.floor(vals.length/2)]:0;
    rows.forEach(row=>{
      const it=row.flow.outs.find(x=>x.id===r.id);
      if(it&&med&&it.amount>med+500000)ev.push({key:row.key,text:`Cuota alta · ${r.description}: ${fmt(it.amount)}`});
    });
    const last=moAdd((r.debtStart||thisMonth()).slice(0,7),r.debtMonths-1);
    if(inRange(last)>=0)ev.push({key:last,text:`Última cuota · ${r.description}`});
  });
  (d.entries||[]).filter(e=>e.type==="debt"&&e.autoPayroll&&!e.closed&&(e.debtMonths||0)>1).forEach(e=>{
    const last=moAdd((e.debtStart||e.date).slice(0,7),e.debtMonths-1);
    if(inRange(last)>=0)ev.push({key:last,text:`Última libranza · ${e.description}: la nómina sube ${fmt(minPaymentOf(d,e))}`});
  });
  rows.forEach(r=>r.flow.oneoffs.forEach(o=>ev.push({key:r.key,text:`Entra ${o.name}: ${fmt(o.amount)}`})));
  rows.forEach(r=>r.flow.outs.filter(o=>o.yearly).forEach(o=>ev.push({key:r.key,text:`Pago anual · ${o.name}: ${fmt(o.amount)}`})));
  rows.forEach(r=>r.flow.outs.filter(o=>o.kind==="plan").forEach(o=>ev.push({key:r.key,text:`Sale ${o.name}: ${fmt(o.amount)}`})));
  const fin=(d.juntos||{}).financiacion;
  if(fin&&inRange(fin.date.slice(0,7))>=0)ev.push({key:fin.date.slice(0,7),text:`Vence la financiación del apartamento: ${fmt(fin.amount)}. Se cubre con el crédito; su cuota aún no está en la curva`});
  return ev.sort((a,b)=>a.key.localeCompare(b.key));
}

async function doSaveAporte(){
  const A=Number(aporteEdit.A)||0,B=Number(aporteEdit.B)||0;
  if(A+B<=0){showToast("⚠️ Ingresa un monto válido");return;}
  const d=D();
  aporteEdit=null;
  await persist({...d,juntos:{...(d.juntos||{}),aporteCasa:{...(d.juntos||{}).aporteCasa,A,B}}});
  showToast("✓ Aporte actualizado");
}
function setRecUser(u){
  const d=D();recForm.user=u;
  if(recForm.type==="expense")recForm.category=defaultRecCat(d,u);
  render();
}
function defaultRecCat(d,u){
  const list=u==="shared"?(d.cats.shared||[]):(d.cats.personal||[]);
  const fb=u==="shared"?"Otro compartido":"Otro personal";
  return list.includes(fb)?fb:(list[0]||fb);
}
function doNewRec(type){
  const d=D();
  const user=type==="income"?"A":"shared";
  recForm={id:null,type,description:"",amount:"",user,category:type==="income"?"💸Nomina":defaultRecCat(d,user),pay:"quincenal",freq:"monthly",day:"",month:""};

}
function doEditRec(id,where){
  const rid=Number(id)||id;
  const r=(D().recurring||[]).find(x=>x.id===rid);if(!r)return;
  recForm={id:rid,type:r.type,description:r.description||"",amount:String(r.amount||""),user:r.user,category:r.category||"",
    pay:r.pay||"quincenal",freq:isYearly(r)?"yearly":"monthly",day:r.day?String(r.day):"",month:r.month?String(r.month):"",where:where||""};
  render();
}
async function doSaveRec(){
  const f=recForm;if(!f)return;
  const amt=Number(f.amount);
  const isInc=f.type==="income",isDebt=f.type==="debt";
  const yearly=!isInc&&!isDebt&&f.freq==="yearly";
  const day=f.day===""?0:Math.round(Number(f.day));
  if(f.day!==""&&!(day>=1&&day<=31)){showToast("⚠️ El día va de 1 a 31");return;}
  if(yearly&&(!day||!f.month)){showToast("⚠️ Elige el mes y el día");return;}
  const sched=isInc?{pay:f.pay==="monthly"?"monthly":"quincenal",day:f.pay==="monthly"?(day||30):null}
    :{freq:yearly?"yearly":"monthly",day:day||null,month:yearly?Number(f.month):null};
  const d=D();
  if(isDebt){
    recForm=null;
    await persist({...d,recurring:(d.recurring||[]).map(r=>r.id===f.id?{...r,...sched}:r)});
    showToast("✓ Día de pago guardado");return;
  }
  if(!f.description.trim()){showToast("⚠️ Ponle un nombre");return;}
  if(!amt||amt<=0){showToast("⚠️ Ingresa un monto válido");return;}
  const data={description:f.description.trim(),amount:amt,user:f.user,category:f.category,...sched};
  const recurring=f.id
    ?(d.recurring||[]).map(r=>r.id===f.id?{...r,...data,isGross:r.amount===amt&&!!r.isGross,isEstimated:r.amount===amt&&!!r.isEstimated}:r)
    :[...(d.recurring||[]),{id:Date.now(),type:f.type,...data,date:today(),isRecurring:true,registeredBy:"B"}];
  recForm=null;
  await persist({...d,recurring});
  showToast(f.id?"✓ Actualizado":"✓ Agregado a Vida juntos");
}
function doTrashRec(id){
  const rid=Number(id)||id;
  if(!confirmDelete||confirmDelete.type!=="rec"||confirmDelete.id!==rid){confirmDelete={type:"rec",id:rid};setTimeout(()=>{confirmDelete=null;render();},3000);render();return;}
  confirmDelete=null;
  doDeleteRecurring(rid);
}

// ── Curva de presupuesto ───────────────────────────────────────────────────
let jChart={};
function jChartW(){const w=window.innerWidth||800;return Math.max(280,w>=768?Math.min(w,1200)-206-68:w-64);}
function niceTicks(lo,hi,count){
  const span=(hi-lo)||1;const raw=span/count;const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw)||raw;
  const out=[];for(let v=Math.floor(lo/step)*step;v<=hi+step*0.001;v+=step)out.push(Math.round(v));
  if(out[out.length-1]<hi)out.push(out[out.length-1]+step);
  return out;
}
function xLabels(keys,xs,gW,y){
  const step=Math.max(1,Math.ceil(36/gW));
  return keys.map((k,i)=>{
    if(i%step!==0)return"";
    const mo=parseInt(k.slice(5))-1;const first=i===0||(mo<step&&i>0);
    return`<text x="${xs[i].toFixed(1)}" y="${y}" text-anchor="middle" font-size="10.5" fill="var(--ink3)">${MO_ES[mo]}</text>${first?`<text x="${xs[i].toFixed(1)}" y="${y+12}" text-anchor="middle" font-size="9.5" fill="var(--ink3)">${k.slice(0,4)}</text>`:""}`;
  }).join("");
}
function yGrid(ticks,y,W,pL,pR){
  return ticks.map(t=>`<line x1="${pL}" x2="${W-pR}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="${t===0?"var(--ink3)":"var(--line)"}" stroke-width="${t===0?1:.75}"/><text x="${pL-6}" y="${(y(t)+3.5).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--ink3)">${fmtAx(t)}</text>`).join("");
}
function chartShell(id,W,H,inner,pL,pR,pT,pB,label){
  return`<div class="chart-box" id="jb-${id}">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${escH(label)}" style="display:block;width:100%;height:auto;font-family:var(--num);font-variant-numeric:tabular-nums;">
      ${inner}
      <rect x="${pL}" y="${pT}" width="${W-pL-pR}" height="${H-pT-pB}" fill="transparent" style="touch-action:pan-y;cursor:crosshair;" onpointermove="jChartHover(event,'${id}')" onpointerdown="jChartHover(event,'${id}')" onpointerleave="jChartLeave('${id}')"/>
    </svg>
    <div class="chart-tip" id="jt-${id}"></div>
  </div>`;
}
function buildSaldoChart(rows,wishSaldos,groups){
  const W=jChartW(),H=240,pL=46,pR=14,pT=30,pB=34;
  const n=rows.length;const cW=W-pL-pR,cH=H-pT-pB;
  const all=[0,...rows.map(r=>r.saldo),...(wishSaldos||[])];
  const ticks=niceTicks(Math.min(...all),Math.max(...all),4);
  const lo=ticks[0],hi=ticks[ticks.length-1];
  const y=v=>pT+cH*(1-(v-lo)/((hi-lo)||1));
  const xs=rows.map((_,i)=>pL+(n>1?cW*i/(n-1):cW/2));
  const path=vals=>vals.map((v,i)=>(i?"L":"M")+xs[i].toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  const sal=rows.map(r=>r.saldo);
  const y0=y(Math.max(lo,0)).toFixed(1);
  const area=`${path(sal)} L${xs[n-1].toFixed(1)} ${y0} L${xs[0].toFixed(1)} ${y0} Z`;
  const gW=n>1?cW/(n-1):cW;
  const markers=groups.map(g=>{
    const x=xs[g.i];
    return`<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${pT-8}" y2="${pT+cH}" stroke="var(--ink3)" stroke-width="1" stroke-dasharray="2 3"/>
    <circle cx="${x.toFixed(1)}" cy="${(y(sal[g.i])).toFixed(1)}" r="4.5" fill="var(--ch-3)" stroke="var(--card)" stroke-width="2"/>
    <circle cx="${x.toFixed(1)}" cy="${pT-16}" r="9" fill="var(--card)" stroke="var(--ink3)" stroke-width="1"/>
    <text x="${x.toFixed(1)}" y="${pT-12.5}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink)">${g.n}</text>`;
  }).join("");
  const lastY=y(sal[n-1]);
  const lbl=(v,yy)=>`<text x="${(W-pR).toFixed(1)}" y="${yy.toFixed(1)}" text-anchor="end" font-size="11.5" font-weight="700" fill="var(--ink)" stroke="var(--card)" stroke-width="3" paint-order="stroke">${fmt(v)}</text>`;
  let wishLine="",labels=lbl(sal[n-1],Math.max(pT+11,lastY-8));
  if(wishSaldos){
    const wLast=wishSaldos[n-1];
    wishLine=`<path d="${path(wishSaldos)}" fill="none" stroke="var(--ch-3)" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>`;
    if(Math.abs(wLast-sal[n-1])>1)labels+=lbl(wLast,Math.min(pT+cH-4,Math.max(y(wLast)+16,lastY+8)));
  }
  jChart.saldo={W,xs,rows,mode:"line",tip:i=>{
    const out=[["Saldo",fmt(rows[i].saldo),"var(--ch-3)"]];
    if(wishSaldos)out.push(["Con wishlist",fmt(wishSaldos[i]),"var(--ch-3)"]);
    out.push(["Queda en el mes",fmt(rows[i].net),null]);
    return out;
  },y:i=>y(sal[i]),pT,pB,H,notes:i=>groups.flatMap(g=>g.items).filter(x=>x.key===rows[i].key).map(x=>x.text)};
  const inner=`${yGrid(ticks,y,W,pL,pR)}
    <path d="${area}" fill="var(--ch-3)" opacity=".10"/>
    ${markers}
    ${wishLine}
    <path d="${path(sal)}" fill="none" stroke="var(--ch-3)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${labels}
    ${xLabels(rows.map(r=>r.key),xs,gW,H-pB+15)}
    <line class="jx" id="jx-saldo" x1="0" x2="0" y1="${pT}" y2="${pT+cH}" stroke="var(--ink2)" stroke-width="1" visibility="hidden"/>
    <circle id="jd-saldo" r="4.5" fill="var(--ch-3)" stroke="var(--card)" stroke-width="2" visibility="hidden"/>`;
  return chartShell("saldo",W,H,inner,pL,pR,pT,pB,"Saldo acumulado proyectado por mes");
}
function buildFlujoChart(rows){
  const W=jChartW(),H=210,pL=46,pR=14,pT=10,pB=34;
  const n=rows.length;const cW=W-pL-pR,cH=H-pT-pB,gW=cW/n;
  const ticks=niceTicks(0,Math.max(...rows.flatMap(r=>[r.in,r.out]),1),4);
  const hi=ticks[ticks.length-1];
  const y=v=>pT+cH*(1-v/(hi||1));
  const xs=rows.map((_,i)=>pL+gW*i+gW/2);
  const bw=Math.max(3,Math.min(24,(gW-6)/2-1));
  const bar=(x,v,c)=>{
    if(v<=0)return"";
    const top=y(v),base=y(0),r=Math.min(4,bw/2,base-top);
    return`<path d="M${x.toFixed(1)} ${base.toFixed(1)} V${(top+r).toFixed(1)} Q${x.toFixed(1)} ${top.toFixed(1)} ${(x+r).toFixed(1)} ${top.toFixed(1)} H${(x+bw-r).toFixed(1)} Q${(x+bw).toFixed(1)} ${top.toFixed(1)} ${(x+bw).toFixed(1)} ${(top+r).toFixed(1)} V${base.toFixed(1)} Z" fill="${c}"/>`;
  };
  const bars=rows.map((r,i)=>bar(xs[i]-bw-1,r.in,"var(--ch-in)")+bar(xs[i]+1,r.out,"var(--ch-out)")).join("");
  jChart.flujo={W,xs,rows,mode:"band",gW,tip:i=>[["Entradas",fmt(rows[i].in),"var(--ch-in)"],["Salidas",fmt(rows[i].out),"var(--ch-out)"],["Queda",fmt(rows[i].net),null]],notes:()=>[]};
  const inner=`${yGrid(ticks,y,W,pL,pR)}
    <rect id="jx-flujo" x="0" y="${pT}" width="${gW.toFixed(1)}" height="${cH}" fill="var(--ink3)" opacity=".12" visibility="hidden"/>
    ${bars}
    ${xLabels(rows.map(r=>r.key),xs,gW,H-pB+15)}`;
  return chartShell("flujo",W,H,inner,pL,pR,pT,pB,"Entradas y salidas por mes");
}
function jChartHover(ev,id){
  const c=jChart[id];if(!c)return;
  const svg=ev.currentTarget.ownerSVGElement;const box=svg.getBoundingClientRect();
  const sx=(ev.clientX-box.left)*(c.W/box.width);
  let i=0,best=Infinity;c.xs.forEach((x,k)=>{const dist=Math.abs(x-sx);if(dist<best){best=dist;i=k;}});
  const x=c.xs[i];
  const line=document.getElementById("jx-"+id);
  if(line){
    line.setAttribute("visibility","visible");
    if(c.mode==="band")line.setAttribute("x",(x-c.gW/2).toFixed(1));
    else{line.setAttribute("x1",x);line.setAttribute("x2",x);}
  }
  const dot=document.getElementById("jd-"+id);
  if(dot){dot.setAttribute("visibility","visible");dot.setAttribute("cx",x);dot.setAttribute("cy",c.y(i));}
  const tip=document.getElementById("jt-"+id);if(!tip)return;
  tip.textContent="";
  const h=document.createElement("div");h.className="h";h.textContent=moLargo(c.rows[i].key);tip.appendChild(h);
  c.tip(i).forEach(([l,v,col])=>{
    const r=document.createElement("div");r.className="r";
    const lab=document.createElement("span");
    if(col){const sw=document.createElement("span");sw.className="sw";sw.style.background=col;lab.appendChild(sw);}
    lab.appendChild(document.createTextNode(l));
    const val=document.createElement("b");val.textContent=v;
    r.appendChild(lab);r.appendChild(val);tip.appendChild(r);
  });
  c.notes(i).forEach(t=>{const nt=document.createElement("div");nt.className="n";nt.textContent=t;tip.appendChild(nt);});
  tip.style.display="block";
  const scale=box.width/c.W;const px=x*scale;const tw=tip.offsetWidth;
  tip.style.left=Math.max(0,Math.min(box.width-tw,px+12+tw>box.width?px-tw-12:px+12))+"px";
  tip.style.top="8px";
}
function jChartLeave(id){
  ["jx-","jd-"].forEach(p=>{const el=document.getElementById(p+id);if(el)el.setAttribute("visibility","hidden");});
  const tip=document.getElementById("jt-"+id);if(tip)tip.style.display="none";
}

function renderLeverage(d){

  const base=normalIn(f)+f.payrollTot;
  const cuotas=f.cuotas+f.payrollTot;
  const pct=base>0?cuotas/base:0;
  const tope=Math.round(base*0.30);
  const margen=tope-cuotas;
  const col=pct>0.40?"var(--bad)":pct>0.30?"var(--gold)":"var(--good)";
  const ends=curveEvents(d,rows).filter(e=>e.text.startsWith("Última")).map(e=>{
    const nx=rows.find(r=>r.key===moAdd(e.key,1));if(!nx)return"";

  }).join("");
  const sinCuota=debtsOf(d).filter(de=>!de.closed&&(de.debtMonths||0)<=1&&pendingOf(d,de)>0.5);
  const sinCuotaTotal=sinCuota.reduce((s,de)=>s+pendingOf(d,de),0);

    <div class="ct">¿Cuánto pueden apalancarse?</div>
    <div class="row" style="margin-bottom:3px;"><span class="lbl">Cuotas de deuda sobre el ingreso</span><b style="font-family:var(--num);font-size:17px;">${(pct*100).toFixed(1)}%</b></div>
    <div class="j-gauge"><div style="width:${Math.min(100,pct/0.6*100).toFixed(1)}%;background:${col};"></div><span style="left:50%;"></span></div>
    <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3);margin-bottom:10px;"><span>0%</span><span>Tope de referencia 30%</span><span>60%</span></div>
    <div class="j-key"><span style="flex:1;">Ingreso conjunto antes de libranza</span><b style="font-family:var(--num);">${fmt(base)}</b></div>
    <div class="j-key"><span style="flex:1;">Cuotas de deudas y libranza este mes</span><b style="font-family:var(--num);">${fmt(cuotas)}</b></div>
    <div class="j-key"><span style="flex:1;">Tope de referencia (30%)</span><b style="font-family:var(--num);">${fmt(tope)}</b></div>
    <div class="j-key" style="font-weight:650;"><span style="flex:1;">${margen>=0?"Margen para más cuotas":"Por encima del tope"}</span><b style="font-family:var(--num);color:${margen>=0?"var(--good)":"var(--bad)"};">${fmt(Math.abs(margen))}/mes</b></div>
    ${ends?`<div class="j-sub" style="margin-top:12px;">Margen cuando se liberen cuotas</div>${ends}`:""}
    <div style="font-size:11.5px;color:var(--ink2d);line-height:1.55;margin-top:10px;">El 30% es una regla práctica, no la política de un banco. Los bancos evalúan con sus propios criterios e ingresos certificados.</div>
    ${sinCuota.length?`<div class="help-box" style="margin:10px 0 0;">⚠️ ${fmt(sinCuotaTotal)} en deudas sin cuota fija (${sinCuota.map(de=>escH(de.description)).join(", ")}) no están en la curva hasta que tengan plazo.</div>`:""}
  </div>`;
}
function renderJuntosCurva(d){
  const n=juntosHorizon;
  const rows=jointCurve(d,n);

  const hasPriced=(d.wishlist||[]).some(w=>w.status!=="comprado"&&Number(w.price)>0);

  const wishSaldos=withWish?rows.map((r,i)=>r.saldo-plan.spent[i]):null;
  const events=curveEvents(d,rows);
  const W=jChartW(),cW=W-60,minGap=20;
  const stepX=n>1?cW/(n-1):cW;
  const groups=[];
  events.forEach(e=>{
    const i=rows.findIndex(r=>r.key===e.key);
    const last=groups[groups.length-1];
    if(last&&(i-last.i)*stepX<minGap)last.items.push(e);
    else groups.push({n:groups.length+1,i,items:[e]});
  });
  const endRow=rows[n-1];
  const tight=rows.reduce((m,r)=>r.net<m.net?r:m,rows[0]);

    ${grossWarning(rows[0].flow)}
