<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<script>(function(){try{var t=localStorage.getItem("theme")||"light";if(t==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
<title>💑 Finanzas en Pareja</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      --num:"SF Mono",SFMono-Regular,ui-monospace,Menlo,Consolas,monospace;}
body{background:var(--bg);color:var(--ink);min-height:100vh;font-family:var(--ui);
     -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45;}
input,select,button,textarea{font-family:var(--ui);}
[style*="monospace"]{font-family:var(--num)!important;font-variant-numeric:tabular-nums;}
.fl,.ct,.nb-lbl{font-variant-numeric:tabular-nums;}
#app{min-height:100vh;}
.body-layout{display:flex;}
#content{flex:1;min-width:0;padding-bottom:88px;}
.hdr{background:var(--surf-hdr);padding:16px 18px 13px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;backdrop-filter:saturate(1.6) blur(8px);}
.hdr h1{font-size:19px;color:var(--ink);margin:0;font-weight:700;letter-spacing:-.01em;}
.hdr small{font-size:11px;color:var(--ink3);font-family:var(--num);}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;}
.sec{padding:16px 16px 8px;}
.card{background:var(--card);border:var(--card-border);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--card-shadow);}
.card-gold{background:linear-gradient(140deg,var(--surf-gold),var(--surf-gold2));border:1px solid color-mix(in srgb, var(--gold) 22%, transparent);}
.card-blue{background:linear-gradient(140deg,var(--surf-blue),var(--surf-blue2));border:1px solid var(--line-blue);}
.card-warn{background:var(--surf-warn);border:1px solid color-mix(in srgb, var(--gold) 27%, transparent);}
.ct{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.09em;font-family:var(--ui);font-weight:600;margin-bottom:11px;}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
.lbl{font-size:13px;color:var(--ink2);}
.val{font-size:14px;font-weight:600;}
.big{font-size:32px;font-weight:700;color:var(--ink);font-family:var(--num);letter-spacing:-.02em;}
.green{color:var(--good);} .red{color:var(--bad);} .gold{color:var(--gold);} .blue{color:var(--pa);} .orange{color:var(--pb);}
.div{height:1px;background:var(--line);margin:9px 0;}
input,select{width:100%;background:var(--inset);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);font-size:15px;box-sizing:border-box;margin-bottom:10px;outline:none;transition:border-color .15s,box-shadow .15s;}
input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb, var(--gold) 15%, transparent);}
input::placeholder{color:var(--ink3);}
.inp-big{font-size:26px;border:2px solid color-mix(in srgb, var(--gold) 30%, transparent);border-radius:14px;text-align:center;color:var(--gold);font-family:var(--num);font-weight:700;padding:16px;}
.btn{width:100%;padding:14px;background:var(--gold);border:none;border-radius:13px;color:var(--on-accent);font-size:15px;font-weight:650;cursor:pointer;margin-bottom:8px;transition:filter .15s,transform .08s;box-shadow:0 2px 8px color-mix(in srgb, var(--gold) 28%, transparent);}
.btn:hover{filter:brightness(1.07);} .btn:active{transform:translateY(1px);}
.btn-green{background:var(--good);color:#fff;box-shadow:0 2px 8px color-mix(in srgb, var(--good) 28%, transparent);}
.btn-dark{background:var(--inset);color:var(--ink);border:1.5px solid var(--line);box-shadow:none;}
.btn-sm{padding:8px 14px;border:none;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;transition:filter .15s;}
.btn-sm:hover{filter:brightness(1.08);}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.chip{padding:8px 14px;border:1.5px solid var(--line);border-radius:22px;font-size:13px;background:var(--card);color:var(--ink2);cursor:pointer;transition:all .15s;font-weight:500;}
.chip:hover{border-color:var(--ink3);}
.chip.on{border-color:var(--gold);background:color-mix(in srgb, var(--gold) 12%, transparent);color:var(--gold);font-weight:650;}
.tag{font-size:11px;padding:3px 9px;border-radius:11px;display:inline-block;font-weight:500;}
.fl{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;display:block;font-weight:600;}
.bar-wrap{height:9px;border-radius:6px;background:var(--line);overflow:hidden;margin:7px 0;}
.bar{height:100%;border-radius:6px;transition:width .6s cubic-bezier(.4,0,.2,1);}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(0,0,0,.05);}
.nb{flex:1;padding:9px 2px 11px;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;}
.nb-icon{font-size:19px;padding:4px 12px;border-radius:12px;transition:background .18s;}
.nb-lbl{font-size:10px;color:var(--ink3);font-weight:500;}
.nb.on .nb-lbl{color:var(--gold);font-weight:650;}
.nb.on .nb-icon{background:color-mix(in srgb, var(--gold) 13%, transparent);}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--surf-good);border:1px solid color-mix(in srgb, var(--good) 40%, transparent);color:var(--good);padding:10px 20px;border-radius:20px;font-size:13px;font-family:monospace;z-index:999;white-space:nowrap;animation:toastIn .3s ease;}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.hide{display:none!important;}
input[type=range]{-webkit-appearance:none;height:6px;border-radius:3px;background:var(--inset);outline:none;padding:0;margin-bottom:10px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--gold);cursor:pointer;}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold);margin:0;}
.help-box{background:var(--inset);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:12px;font-size:12px;color:var(--ink2d);line-height:1.6;}
.ie-row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);}
.ie-row input{margin-bottom:0;flex:1;font-size:13px;padding:8px 12px;}
.icon-btn{background:var(--inset);border:1px solid var(--line);color:var(--ink2);width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:14px;line-height:1;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;}
.icon-btn:hover{background:var(--line);color:var(--ink);}
.card-loan{background:linear-gradient(135deg,var(--surf-loan),var(--surf-loan2));border:1px solid var(--line-loan);}
/* ═══ TEMA CLARO (por defecto) ═══ */
:root{
  --bg:#f4f6fb;--bg2:#eceff7;--card:#ffffff;--inset:#f5f7fc;
  --line:#e3e8f2;--line2:#d7deec;
  --ink:#151a2c;--ink2:#565e73;--ink2d:#6b7288;--ink3:#7d8497;
  --gold:#a87d0a;--good:#0b8a5f;--bad:#d13c30;
  --pa:#2b6cb8;--pb:#d1571f;--teal:#0d8b80;--violet:#5b5fc7;
  --amber:#a06a18;--bronze:#8a5f36;
  --c-pink:#a855c7;--c-rose:#d4477a;--c-amber:#c98a16;
  --on-accent:#ffffff;--shadow:rgba(21,26,44,.10);
  --surf-hdr:#ffffff;--surf-hdr2:#f7f9fd;
  --surf-gold:#fdf9ef;--surf-gold2:#fcf5e4;
  --surf-blue:#f0f5fd;--surf-blue2:#e9f1fb;
  --surf-warn:#fdf7ea;--surf-good:#eaf7f1;--surf-teal:#e7f5f3;
  --surf-info:#eff4fd;--surf-adv:#fcf7ec;
  --surf-loan:#eef6f8;--surf-loan2:#e9f3f7;
  --line-blue:#d3e3f7;--line-loan:#cfe4ea;
  --card-shadow:0 1px 2px rgba(21,26,44,.05),0 4px 16px rgba(21,26,44,.06);

}
/* ═══ TEMA OSCURO ═══ */
:root[data-theme="dark"]{
  --bg:#0a0a12;--bg2:#08080f;--card:#12121e;--inset:#0e0e1a;
  --line:#1e1e3a;--line2:#2a2040;
  --ink:#f0eff4;--ink2:#8b90ab;--ink2d:#6f74a0;--ink3:#585f80;
  --gold:#d4ad35;--good:#4caf80;--bad:#ef5350;
  --pa:#64b5f6;--pb:#ff8a65;--teal:#4db6ac;--violet:#8080c0;
  --amber:#e0a35a;--bronze:#b08050;
  --c-pink:#ba68c8;--c-rose:#f06292;--c-amber:#ffb74d;
  --on-accent:#0a0a12;--shadow:rgba(0,0,0,.45);
  --surf-hdr:#12112a;--surf-hdr2:#0e1428;
  --surf-gold:#1a1428;--surf-gold2:#141428;
  --surf-blue:#121a28;--surf-blue2:#121428;
  --surf-warn:#1a1510;--surf-good:#1e2d1e;--surf-teal:#1e2d2a;
  --surf-info:#1a1f2e;--surf-adv:#1c1630;
  --surf-loan:#0e1a20;--surf-loan2:#0e1a2a;
  --line-blue:#1e2a3a;--line-loan:#1e3040;
  --card-shadow:none;
  --card-border:1px solid var(--line);
}
.card-advice{background:linear-gradient(135deg,var(--surf-adv),var(--surf-gold2));border:1px solid color-mix(in srgb, var(--gold) 40%, transparent);box-shadow:0 0 0 1px color-mix(in srgb, var(--gold) 20%, transparent),0 8px 24px var(--shadow);border-radius:14px;padding:16px;margin-bottom:12px;}
.rank-1{border-left:3px solid var(--gold);box-shadow:0 0 8px color-mix(in srgb, var(--gold) 25%, transparent);}
.rank-2{border-left:3px solid var(--ink3);}
.rank-3{border-left:3px solid var(--bronze);}
.pill-rate{display:inline-block;font-family:monospace;font-size:11px;padding:2px 8px;border-radius:20px;background:color-mix(in srgb, var(--gold) 9%, transparent);border:1px solid color-mix(in srgb, var(--gold) 27%, transparent);color:var(--gold);}
.chip-ok{background:color-mix(in srgb, var(--good) 8%, transparent);border:1px solid color-mix(in srgb, var(--good) 33%, transparent);color:var(--good);}
.chip-warn{background:color-mix(in srgb, var(--gold) 8%, transparent);border:1px solid color-mix(in srgb, var(--gold) 33%, transparent);color:var(--gold);}
.chip-bad{background:color-mix(in srgb, var(--bad) 8%, transparent);border:1px solid color-mix(in srgb, var(--bad) 33%, transparent);color:var(--bad);}
.card-quiet{background:var(--inset);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
.debt-notice{border:1px dashed var(--ink3);}
.sem{display:flex;gap:8px;margin-bottom:12px;}
.sem-chip{flex:1;min-width:0;background:var(--inset);border:1px solid var(--line);border-radius:12px;padding:9px 11px;cursor:pointer;}
.sem-chip .k{font-size:9px;color:var(--ink3);font-family:monospace;text-transform:uppercase;letter-spacing:.08em;}
.sem-chip .v{font-size:14px;font-weight:700;font-family:monospace;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-debt{padding:7px 0;border-bottom:1px solid color-mix(in srgb, var(--line) 13%, transparent);}
@media(min-width:768px){
  #app{max-width:1200px;margin:0 auto;}
  #content{padding-bottom:20px;max-width:700px;}
  .nav{position:sticky;top:0;height:calc(100vh - var(--hdr-h,68px));width:206px;flex-direction:column;border-top:none;border-right:1px solid var(--line);border-bottom:none;left:auto;right:auto;flex-shrink:0;overflow-y:auto;padding:10px 8px;box-shadow:none;background:var(--bg);}
  .nb{border-radius:11px;margin-bottom:2px;}
  .nb.on{background:color-mix(in srgb, var(--gold) 12%, transparent);}
  .nb.on .nb-icon{background:none;}
  .nb{flex:none;flex-direction:row;padding:11px 16px;justify-content:flex-start;gap:10px;width:100%;align-items:center;}
  .nb-icon{font-size:15px;width:24px;text-align:center;padding:0;background:none!important;}
  .nb-lbl{font-size:12px;color:var(--ink3);}
  .nb.on .nb-lbl{color:var(--gold);}
  .nb.on{background:color-mix(in srgb, var(--gold) 8%, transparent);border-radius:0;}
  .toast{bottom:20px;}
  #content.wide{max-width:1080px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start;}
  .col-span{grid-column:1/-1;}
  .sticky-col{position:sticky;top:16px;}
  .card{padding:18px;}
}
</style>

<body>
<div id="app">
  <div class="hdr">
    <div class="row" style="margin-bottom:2px;">
      <h1 id="hdr-title">💑 Finanzas en Pareja</h1>
      <div style="display:flex;align-items:center;gap:6px;">
        <button class="icon-btn" title="Deshacer última acción" onclick="doUndo()">↶</button>
        <button class="icon-btn" title="Cambiar tema claro/oscuro" onclick="toggleTheme()" id="theme-btn">🌙</button>
        <button class="icon-btn" title="Exportar informe completo" onclick="doExportReport()">📤</button>
        <span style="display:flex;align-items:center;margin-left:4px;"><span class="dot" id="fb-dot" style="background:var(--bad);"></span><span id="fb-lbl" style="font-size:10px;color:var(--ink3);font-family:var(--num);">conectando…</span></span>
      </div>
    </div>
    <small id="hdr-sub">cargando…</small>
  </div>
  <div class="body-layout">
    <nav class="nav" id="nav"></nav>
    <div id="content"></div>
  </div>
</div>
<div id="toast-box"></div>

<script>
// ── Firebase Realtime Database REST (no API key needed in test mode) ─────────
const RTDB_URL = "https://finanzas-9e3db-default-rtdb.firebaseio.com/finanzas.json";

let localData = null;
let saving = false;
let fbOnline = false;

function emptyState(){
  return{entries:[],balances:{A:0,B:0},settled:[],names:{A:"Marce",B:"John"},
    cats:{shared:["Casa / Arriendo","Parqueadero","Servicios","Mercado","Deuda banco","Otro compartido"],
    personal:["Transporte","Ropa","Salud","Entretenimiento","Deuda personal","Otro personal"]},
    goals:[],split:{A:50,B:50},recurring:[],budgets:{},loans:[],viajes:[],catSettled:[],trash:[],
    terceros:[],
    plan:{strategy:"avalanche",extraSim:500000,allocAhorro:0,allocDeuda:0}};
}

async function loadFromFirebase(){
  try{
    const r=await fetch(RTDB_URL);
    if(!r.ok)return null;
    const data=await r.json();
    return data;
  }catch(e){return null;}
}

async function saveToFirebase(data){
  try{
    const r=await fetch(RTDB_URL,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
    return r.ok;
  }catch(e){return false;}
}

let undoStack=[]; // in-memory snapshots of state BEFORE each mutation (this session)

async function persist(newData){
  if(localData){undoStack.push(JSON.stringify(localData));if(undoStack.length>30)undoStack.shift();}
  saving=true;localData=newData;
  updateSavingUI(true);
  const ok=await saveToFirebase(newData);
  fbOnline=ok;saving=false;
  updateSavingUI(false);
  render();
}

async function doUndo(){
  if(!undoStack.length){showToast("Nada que deshacer");return;}
  const prev=JSON.parse(undoStack.pop());
  saving=true;localData=prev;updateSavingUI(true);
  const ok=await saveToFirebase(prev);
  fbOnline=ok;saving=false;updateSavingUI(false);
  showToast("↶ Acción deshecha");render();
}

function toggleTheme(){
  const isDark=document.documentElement.getAttribute("data-theme")==="dark";
  if(isDark)document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme","dark");
  try{localStorage.setItem("theme",isDark?"light":"dark");}catch(e){}
  syncThemeBtn();
}
function syncThemeBtn(){
  const b=document.getElementById("theme-btn");
  if(b)b.textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️":"🌙";
}

function updateSavingUI(s){
  const dot=document.getElementById("fb-dot");
  const lbl=document.getElementById("fb-lbl");
  if(dot)dot.style.background=s?"var(--gold)":fbOnline?"var(--good)":"var(--bad)";
  if(lbl)lbl.textContent=s?"guardando…":fbOnline?"en vivo ✓":"local";
}

// ── Helpers ────────────────────────────────────────────────────────────────
const fmt=n=>new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(Math.round(n||0));
// fmtS now shows the EXACT number (no M/K compacting) — the user wants precise figures everywhere.
const fmtS=n=>fmt(n);
// fmtK: compact form, kept only for tight chart/axis labels where exact numbers don't fit.
const fmtK=n=>{if(Math.abs(n)>=1000000)return"$"+(n/1000000).toFixed(1)+"M";if(Math.abs(n)>=1000)return"$"+(n/1000).toFixed(0)+"K";return fmt(n);};
// Format amount input with thousands separators while typing, store raw to state
function fmtAmountInput(el,setter){
  const raw=el.value.replace(/[^0-9]/g,"");
  setter(raw);
  if(raw===""){el.value="";return;}
  el.value=new Intl.NumberFormat("es-CO").format(parseInt(raw));
  // keep cursor at end
  const len=el.value.length;
  try{el.setSelectionRange(len,len);}catch(e){}
}
// Format an initial value for display in an amount field
function fmtInit(v){if(v===""||v===null||v===undefined)return "";return new Intl.NumberFormat("es-CO").format(parseInt(v)||0);}
const today=()=>new Date().toISOString().slice(0,10);
const thisMonth=()=>new Date().toISOString().slice(0,7);
const ICONS={"Casa / Arriendo":"🏠","Parqueadero":"🚗","Servicios":"💡","Mercado":"🛒","Deuda banco":"🏦","Otro compartido":"📦","Transporte":"🚌","Ropa":"👗","Salud":"💊","Entretenimiento":"🎬","Deuda personal":"💳","Otro personal":"🎒"};
const hasEmoji=s=>/^\p{Emoji_Presentation}/u.test(s||"");
const icon=c=>{if(!c)return"📌";if(hasEmoji(c))return"";return ICONS[c]||"📌";};
const catDisplay=c=>{if(!c)return"";if(hasEmoji(c))return c;return(ICONS[c]||"📌")+" "+c;};
const PAL=["var(--gold)","var(--good)","var(--pb)","var(--pa)","var(--c-pink)","var(--c-rose)","var(--teal)","var(--c-amber)"];
function showToast(msg){
  const b=document.getElementById("toast-box");
  b.innerHTML=`<div class="toast">${msg}</div>`;
  setTimeout(()=>b.innerHTML="",2200);
}
function nm(u){const n=D().names;return u==="A"?n.A:u==="B"?n.B:"Compartido";}
function D(){return localData||emptyState();}
function migrate(d){
  const e=emptyState();
  ["names","cats","goals","split","settled","recurring","budgets","loans","entries","balances","viajes","catSettled","trash","plan","terceros"].forEach(k=>{if(!d[k])d[k]=e[k];});
  if(!d.plan.strategy)d.plan.strategy="avalanche";
  return d;
}
// Compute net balance from A's perspective. Positive = B owes A. Negative = A owes B.
function computeBalance(d){
  d=d||D();
  const sp=d.split||{A:50,B:50};
  const spA=sp.A/100;
  let netA=0;
  (d.entries||[]).forEach(e=>{
    if(e.type==="expense"&&e.user==="shared"){
      const fairA=e.amount*spA;
      const paidA=e.paidBy==="A"?e.amount:0;
      netA+=paidA-fairA;
    }
    // transfer entries: abonos, category settlements saved as entries
    if(e.type==="transfer"){
      if(e.paidBy==="B")netA-=e.amount; // B paid A → reduces B's debt to A
      else if(e.paidBy==="A")netA+=e.amount; // A paid B → reduces A's debt to B
    }
  });
  // Legacy: full settlements stored in settled[]
  (d.settled||[]).forEach(s=>{
    if(s.to==="A")netA-=s.amount;
    else if(s.to==="B")netA+=s.amount;
  });
  // Legacy: per-category settlements stored in catSettled[] (fix: was not counted before)
  (d.catSettled||[]).forEach(s=>{
    if(s.to==="A")netA-=s.amount;
    else if(s.to==="B")netA+=s.amount;
  });
  return netA;
}

// ── State ──────────────────────────────────────────────────────────────────
let tab="resumen";
let filterUser=localStorage.getItem("hist_filterUser")||"all";
let filterType=localStorage.getItem("hist_filterType")||"all";
let filterMonth="all";
let searchQ="";
let settingsTab="names";
let chartUser="all",chartMonth=thisMonth();
let showNewLoan=false;
let editId=null;
let confirmDelete=null; // {type:"entry"|"loan"|"settled", id}
let payAmounts={};
let showBalDetail=false;
let formState={type:"expense",user:"shared",category:"",description:"",amount:"",date:today(),paidBy:"A",debtMonths:12,debtStart:today(),note:"",isRecurring:false,registeredBy:"A",incomeSource:"nomina",rate:"",rateType:"monthly",priorityLock:false};
let cuentasMonth="all";
let cuentasExpanded={};
let viajeTab="list";
let selectedViaje=null;
let newViaje={name:"",date:today(),desc:""};

// ═══ MOTOR ASESOR (funciones puras, verificadas) ════════════════════════════
function monthlyRateOf(de){
  if(de.rate==null||de.rate===""||isNaN(Number(de.rate)))return null;
  const r=Number(de.rate)/100;if(r<0)return null;
  return de.rateType==="ea"?Math.pow(1+r,1/12)-1:r;
}
function m2ea(m){return Math.pow(1+m,12)-1;}
function ea2m(e){return Math.pow(1+e,1/12)-1;}
function rateLabel(de){
  const m=monthlyRateOf(de);if(m==null)return"sin tasa";
  if(m<=0)return"sin interés";
  return (m*100).toFixed(2)+"% mensual · "+(m2ea(m)*100).toFixed(1)+"% E.A.";
}
function rateEquivText(rate,type){
  const r=Number(rate);
  if(rate===""||rate==null||isNaN(r)||r<0)return"";
  const m=type==="ea"?ea2m(r/100):r/100;
  return "≈ "+(m*100).toFixed(2)+"% mensual · "+(m2ea(m)*100).toFixed(1)+"% E.A.";
}
function debtsOf(d){return (d.entries||[]).filter(e=>e.type==="debt");}
function pendingOf(d,de){
  if(de.closed)return 0; // refinanciada / absorbida por otra deuda
  const pays=paymentsForDebt(d,de).slice().sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const m=monthlyRateOf(de);
  if(m==null||m<=0){
    const paid=pays.reduce((s,p)=>s+(p.amount||0),0);
    return Math.max(0,de.amount-paid);
  }
  // Con tasa: amortización real — cada mes corre interés sobre el saldo y el pago
  // cubre primero ese interés; solo el excedente abona a capital.
  let bal=de.amount;
  let lastKey=(de.debtStart||de.date||thisMonth()).slice(0,7);
  const accrue=(fromKey,toKey)=>{const n=Math.max(0,moElapsed(fromKey,toKey));for(let i=0;i<n&&i<600;i++)bal*=(1+m);};
  pays.forEach(p=>{
    const k=(p.date||lastKey).slice(0,7);
    accrue(lastKey,k);
    bal-=(p.amount||0);
    lastKey=k;
  });
  accrue(lastKey,thisMonth());
  return Math.max(0,Math.round(bal));
}
function myShareFactor(d,de){const sp=d.split||{A:50,B:50};return de.user==="shared"?(sp.B/100):(de.user==="B"?1:0);}
function minPaymentOf(d,de){
  if(de.minPayment&&Number(de.minPayment)>0)return Number(de.minPayment);
  // Cuota real para deudas a plazo; para deudas sin plazo (debtMonths<=1) se asume
  // un ritmo sostenible de ~12 meses (evita tratar el saldo completo como cuota mensual).
  const months=(de.debtMonths&&de.debtMonths>1)?de.debtMonths:12;
  return Math.round(de.amount/months);
}
function interestThisMonth(d,de){const m=monthlyRateOf(de);if(m==null)return null;return pendingOf(d,de)*m;}
// John's share of monthly interest (Corrección 3: escala compartidas, excluye deudas de Marce)
function totalMonthlyInterest(d){
  return debtsOf(d).map(de=>{const i=interestThisMonth(d,de);return i==null?0:i*myShareFactor(d,de);}).reduce((s,x)=>s+x,0);
}
function rankDebts(d,strategy){
  const list=debtsOf(d).map(de=>{
    const pend=pendingOf(d,de);const m=monthlyRateOf(de);
    return{de,pending:pend,mRate:m,hasRate:m!=null,interestMonth:m!=null?pend*m:null,
      lock:!!de.priorityLock,shared:de.user==="shared",myShare:pend*myShareFactor(d,de),min:minPaymentOf(d,de)};
  }).filter(x=>x.pending>0.5&&!x.lock);
  if(strategy==="snowball"){list.sort((a,b)=>a.pending-b.pending||(b.mRate||0)-(a.mRate||0));}
  else{list.sort((a,b)=>{
    if(a.hasRate!==b.hasRate)return a.hasRate?-1:1;
    if(a.hasRate)return (b.mRate-a.mRate)||(b.pending-a.pending);
    return b.pending-a.pending;});}
  return list;
}
// Corrección 4: prima/cesantías solo como fallback si NO hay ingresos recurrentes registrados
function incomeForMonth(d,monthKey){
  const rec=(d.recurring||[]).filter(r=>r.type==="income");
  if(rec.length)return rec.reduce((s,r)=>s+ovTotal(r.overrides&&r.overrides[monthKey],r.amount),0);
  let total=6200000;const mo=monthKey.slice(5);
  if(mo==="06"||mo==="12")total+=3487899;
  return total;
}
// Corrección 5: escala admin/servicios/compartidas por la parte de John
function fixedOutflowsForMonth(d,monthKey){
  const sp=d.split||{A:50,B:50};let fixed=0;
  const recCats=new Set((d.recurring||[]).filter(r=>r.type==="debt"&&(r.debtMonths||0)>1).map(r=>r.category+"|"+r.description));
  (d.recurring||[]).forEach(r=>{
    if(r.type==="income")return;
    if(r.type==="debt"&&(r.debtMonths||0)>1){
      const startKey=(r.debtStart||monthKey).slice(0,7);const el=moElapsed(startKey,monthKey);
      if(el<0||el>=r.debtMonths)return;
      const monthly=Math.round(r.amount/r.debtMonths);
      const amt=ovTotal(r.overrides&&r.overrides[monthKey],monthly);
      fixed+=r.user==="shared"?amt*(sp.B/100):(r.user==="B"?amt:0);
    }else if(r.type==="expense"){
      const amt=ovTotal(r.overrides&&r.overrides[monthKey],r.amount);
      fixed+=r.user==="shared"?amt*(sp.B/100):(r.user==="B"?amt:0);
    }
  });
  (d.entries||[]).filter(e=>e.type==="debt"&&(e.debtMonths||0)>1&&!e.isRecurring&&!e.closed).forEach(e=>{
    const startKey=(e.debtStart||e.date||"").slice(0,7);if(!startKey)return;
    const el=moElapsed(startKey,monthKey);if(el<0||el>=e.debtMonths)return;
    if(recCats.has(e.category+"|"+(e.description||"")))return;
    const monthly=minPaymentOf(d,e);
    fixed+=e.user==="shared"?monthly*(sp.B/100):(e.user==="B"?monthly:0);
  });
  return Math.round(fixed);
}
function capitalPlan(d,monthKey){const income=incomeForMonth(d,monthKey);const fixed=fixedOutflowsForMonth(d,monthKey);return{income,fixed,free:income-fixed};}

function totalAsignado(d,mk){return asignacionesMes(d,mk).reduce((s,a)=>s+(Number(a.amount)||0),0);}
// Lo que de verdad queda libre para maniobrar (disponible − lo ya apartado)

// Corrección 6: definición única de "gasto base de vida" (recurrentes de gasto, no deuda)
function monthlyLivingCost(d,monthKey){
  const sp=d.split||{A:50,B:50};let c=0;
  (d.recurring||[]).forEach(r=>{if(r.type!=="expense")return;
    const amt=ovTotal(r.overrides&&r.overrides[monthKey],r.amount);
    c+=r.user==="shared"?amt*(sp.B/100):(r.user==="B"?amt:0);});
  return Math.round(c);
}
function emergencyTarget(d,months){return monthlyLivingCost(d,thisMonth())*(months||3);}
function emergencyFundNow(d){return (d.goals||[]).filter(g=>/emerg|fondo|colch/i.test(g.name||"")).reduce((s,g)=>s+(g.current||0),0);}
function emergencyGap(d){return Math.max(0,emergencyTarget(d,3)-emergencyFundNow(d));}
function suggestAllocation(d,monthKey){
  const {free}=capitalPlan(d,monthKey);
  if(free<=0)return{deficit:true,free};
  const feGap=emergencyGap(d);
  const aporteFE=Math.min(free,Math.max(0,Math.min(feGap,free*0.2)));
  const rest=free-aporteFE;
  const rk=rankDebts(d,"avalanche");
  const hayDeudaCara=rk.some(x=>x.hasRate&&x.mRate>0);
  const wDeuda=hayDeudaCara?0.7:0.3;const top=rk[0];
  return{deficit:false,free,fondoEmergencia:Math.round(aporteFE),
    extraDeuda:Math.round(rest*wDeuda),ahorroMetas:Math.round(rest*(1-wDeuda)),
    deudaObjetivo:top?top.de.description:null};
}
// Simulador mes a mes con Correcciones 1 (impagables) y 2 (mínimos liberados al inicio)
function simulatePayoff(d,strategy,extraMonthly,maxMonths){
  maxMonths=maxMonths||600;
  let debts=rankDebts(d,strategy).map(x=>({id:x.de.id,desc:x.de.description,bal:x.pending,m:x.mRate!=null?x.mRate:0,min:x.min}));
  if(debts.length===0)return{months:0,totalInterest:0,timeline:[],debtFree:true,unpayable:null};
  const initialMins={};debts.forEach(dd=>initialMins[dd.id]=dd.min);
  function reorder(list){
    const l=list.filter(x=>x.bal>0.5);
    if(strategy==="snowball")l.sort((a,b)=>a.bal-b.bal||b.m-a.m);
    else l.sort((a,b)=>b.m-a.m||b.bal-a.bal);
    return l;
  }
  const timeline=[];let month=0;let totalInterest=0;
  while(debts.some(dd=>dd.bal>0.5)&&month<maxMonths){
    month++;
    let freed=0;debts.forEach(dd=>{if(dd.bal<=0.5)freed+=initialMins[dd.id]||0;});
    let pool=extraMonthly+freed;
    const unpay=debts.filter(dd=>dd.bal>0.5&&dd.m>0&&dd.min<dd.bal*dd.m);
    let ordered=reorder(debts);
    if(unpay.length){unpay.sort((a,b)=>b.m-a.m);ordered=unpay.concat(ordered.filter(x=>unpay.indexOf(x)<0));}
    for(const dd of debts){
      if(dd.bal<=0.5){dd.bal=0;continue;}
      const interes=dd.bal*dd.m;totalInterest+=interes;dd.bal+=interes;
      dd.bal-=Math.min(dd.bal,dd.min);
    }
    for(const dd of ordered){
      if(pool<=0)break;if(dd.bal<=0.5){dd.bal=0;continue;}
      const ep=Math.min(dd.bal,pool);dd.bal-=ep;pool-=ep;
    }
    timeline.push({month,totalBal:Math.round(debts.reduce((s,x)=>s+Math.max(0,x.bal),0))});
  }
  const debtFree=debts.every(dd=>dd.bal<=0.5);
  let growing=null;
  if(!debtFree){
    const g=debts.filter(dd=>dd.bal>0.5&&dd.m>0&&dd.min<dd.bal*dd.m).sort((a,b)=>b.bal-a.bal)[0];
    if(g)growing={desc:g.desc,need:Math.ceil(g.bal*g.m)};
  }
  return{months:month,totalInterest:Math.round(totalInterest),timeline,debtFree,unpayable:growing};
}
function forecastNextMonthFixed(d){
  const mk=thisMonth();const sp=d.split||{A:50,B:50};const items=[];
  (d.recurring||[]).forEach(r=>{if(r.type!=="expense")return;

    if(share>0)items.push({name:r.description||r.category,amount:Math.round(share)});});
  return items;
}
// Feed de consejos ordenados por severidad
function advisorInsights(d){
  const out=[];const strat=(d.plan&&d.plan.strategy)||"avalanche";
  const rk=rankDebts(d,strat);const withRate=rk.filter(x=>x.hasRate);
  const noRate=debtsOf(d).filter(de=>pendingOf(d,de)>0.5&&!de.priorityLock&&monthlyRateOf(de)==null);
  if(withRate.length===0&&noRate.length>0){
    out.push({sev:"warn",icon:"🏦",title:"Agrega las tasas de interés de tus deudas",
      body:"Sin tasas no puedo priorizar por costo real. Toca una deuda y añade su interés (mensual o E.A.) para activar tu plan de avalancha.",
      cta:{tab:"deudas",label:"Ir a Deudas →"}});
  }
  if(withRate.length){const top=withRate[0];
    out.push({sev:"bad",icon:"🎯",title:"Prioriza "+top.de.description,
      body:rateLabel(top.de)+" — te cuesta "+fmt(Math.round(top.interestMonth))+"/mes en intereses. Ataca esta deuda primero.",
      cta:{tab:"asesor",asesorTab:"simular",label:"Simular abono →"}});}
  const alloc=suggestAllocation(d,thisMonth());
  if(alloc.deficit){out.push({sev:"bad",icon:"⚠️",title:"Este mes tus gastos fijos superan tu ingreso",
      body:"Revisa obligaciones; considera renegociar cuotas o posponer abonos extra.",cta:{tab:"asesor",asesorTab:"plan",label:"Ver mi plan →"}});}
  else if(alloc.free>0&&alloc.deudaObjetivo&&alloc.extraDeuda>0){
    out.push({sev:"warn",icon:"💰",title:"Tienes "+fmt(alloc.free)+" libres este mes",
      body:"Sugerencia: "+fmt(alloc.extraDeuda)+" extra a "+alloc.deudaObjetivo+", "+fmt(alloc.fondoEmergencia)+" a tu fondo, "+fmt(alloc.ahorroMetas)+" a ahorro/metas.",
      cta:{tab:"asesor",asesorTab:"plan",label:"Ver mi plan →"}});}
  const inc=incomeForMonth(d,thisMonth());
  debtsOf(d).forEach(de=>{const pend=pendingOf(d,de);if(pend<=0.5||de.priorityLock)return;
    const pct=de.amount>0?(1-pend/de.amount):0;
    if(pct>=0.7&&pend<=inc)out.push({sev:"ok",icon:"🟢",title:de.description+" está al "+Math.round(pct*100)+"%",
      body:"Un abono de "+fmt(pend)+" la elimina por completo.",cta:{tab:"deudas",label:"Ver deuda →"}});});
  const mo=thisMonth().slice(5);const topSeason=withRate[0]||rk[0];
  if(mo==="06"||mo==="12")out.push({sev:"warn",icon:"➕",title:"Este mes entra tu Prima ($3.487.899)",
      body:topSeason?("Destínala a "+topSeason.de.description+": adelantas varias cuotas y ahorras intereses."):"Destínala a tu deuda de mayor tasa.",
      cta:{tab:"asesor",asesorTab:"simular",label:"Simular con prima →"}});
  else if(mo==="02")out.push({sev:"warn",icon:"➕",title:"Febrero: entran tus cesantías",
      body:"Un abono grande a tu deuda de mayor tasa reduce mucho el interés total.",cta:{tab:"asesor",asesorTab:"simular",label:"Simular →"}});
  const activeLoans=(d.loans||[]).filter(l=>l.status==="active");
  const netLoanA=activeLoans.reduce((s,l)=>l.from==="A"?s+(l.amount-l.paid):s-(l.amount-l.paid),0);
  if(Math.abs(netLoanA)>1){const who=netLoanA<0?d.names.A+" le debe a "+d.names.B:d.names.B+" le debe a "+d.names.A;
    out.push({sev:"info",icon:"🤝",title:"Préstamo entre ustedes",body:who+" "+fmt(Math.abs(netLoanA))+".",cta:{tab:"mas",moreTab:"config",configTab:"prestamos",label:"Ver préstamos →"}});}
  // Cuentas por cobrar: capital que vuelve + interés mensual que entra
  const porCobrar=totalPorCobrar(d);
  if(porCobrar>0){
    const intMes=ingresoInteresesMes(d);
    const conFecha=tercerosActive(d).filter(t=>t.kind!=="debt"&&t.dueDate).sort((a,b)=>a.dueDate.localeCompare(b.dueDate))[0];
    const topDeuda=(withRate[0]||rk[0]);
    out.push({sev:"ok",icon:"💰",title:"Te deben "+fmt(porCobrar),
      body:(intMes>0?"Te entran "+fmt(intMes)+"/mes en intereses. ":"")+
        (conFecha?"El capital vuelve el "+conFecha.dueDate+". ":"")+
        (topDeuda?"Cuando entre, abonarlo a "+topDeuda.de.description+" reduce fuerte tus intereses.":""),
      cta:{tab:"deudas",deudasTab:"porcobrar",label:"Ver por cobrar →"}});
  }
  const order={bad:0,warn:1,info:2,ok:3};
  out.sort((a,b)=>order[a.sev]-order[b.sev]);
  return out;
}

function tercerosActive(d){return (d.terceros||[]).filter(t=>t.status!=="settled");}
function terceroPending(t){return Math.max(0,(t.amount||0)-(t.paid||0));}
function terceroMonthlyRate(t){
  if(t.rate==null||t.rate===""||isNaN(Number(t.rate)))return 0;
  const r=Number(t.rate)/100;if(r<0)return 0;
  return t.rateType==="ea"?Math.pow(1+r,1/12)-1:r;
}
function terceroMonthlyInterest(t){return Math.round(terceroPending(t)*terceroMonthlyRate(t));}
function terceroInterestPaid(t){return (t.payments||[]).filter(p=>p.kind==="interes").reduce((s,p)=>s+(p.amount||0),0);}
// Total que te deben (capital pendiente de todas las cuentas por cobrar)
function totalPorCobrar(d){return tercerosActive(d).filter(t=>t.kind!=="debt").reduce((s,t)=>s+terceroPending(t),0);}
// Ingreso mensual esperado por intereses de terceros
function ingresoInteresesMes(d){return tercerosActive(d).filter(t=>t.kind!=="debt").reduce((s,t)=>s+terceroMonthlyInterest(t),0);}

async function doAddTercero(){
  const amt=Number(newTercero.amount);
  if(!newTercero.name.trim()){showToast("⚠️ Ponle un nombre");return;}
  if(!amt||amt<=0){showToast("⚠️ Ingresa un monto válido");return;}
  const d=D();
  const hasRate=newTercero.rate!==""&&newTercero.rate!=null&&!isNaN(Number(newTercero.rate));
  const t={id:editTerceroId||Date.now(),kind:"receivable",name:newTercero.name.trim(),
    amount:amt,paid:editTerceroId?((d.terceros||[]).find(x=>x.id===editTerceroId)||{}).paid||0:0,
    rate:hasRate?Number(newTercero.rate):null,rateType:hasRate?(newTercero.rateType||"monthly"):null,
    interestOnly:!!newTercero.interestOnly,date:newTercero.date,dueDate:newTercero.dueDate||null,
    note:newTercero.note||null,status:"active",
    payments:editTerceroId?((d.terceros||[]).find(x=>x.id===editTerceroId)||{}).payments||[]:[]};
  const list=editTerceroId?(d.terceros||[]).map(x=>x.id===editTerceroId?t:x):[...(d.terceros||[]),t];
  await persist({...d,terceros:list});
  const wasEdit=!!editTerceroId;
  editTerceroId=null;showNewTercero=false;
  newTercero={name:"",amount:"",rate:"",rateType:"monthly",interestOnly:true,date:today(),dueDate:"",note:""};
  showToast(wasEdit?"✓ Actualizado":"✓ Préstamo registrado");
}
function doEditTercero(id){
  const d=D();const tid=Number(id)||id;
  const t=(d.terceros||[]).find(x=>x.id===tid);if(!t)return;
  newTercero={name:t.name,amount:String(t.amount),rate:t.rate!=null?String(t.rate):"",
    rateType:t.rateType||"monthly",interestOnly:!!t.interestOnly,date:t.date,
    dueDate:t.dueDate||"",note:t.note||""};
  editTerceroId=tid;showNewTercero=true;render();
}
// Cobrar intereses: entra plata real -> se registra como ingreso y queda en el historial.
async function doTerceroCobrarInteres(id){
  const d=D();const tid=Number(id)||id;
  const t=(d.terceros||[]).find(x=>x.id===tid);if(!t)return;
  const amt=terceroMonthlyInterest(t);
  if(amt<=0){showToast("Este préstamo no cobra intereses");return;}
  const list=(d.terceros||[]).map(x=>x.id===tid?{...x,payments:[...(x.payments||[]),{date:today(),amount:amt,kind:"interes"}]}:x);
  const inc={id:Date.now(),date:today(),type:"income",user:"B",category:"Intereses",
    description:"Interés préstamo "+t.name,amount:amt,paidBy:null,note:null,
    isRecurring:false,registeredBy:"B",incomeSource:"otro"};
  await persist({...d,terceros:list,entries:[...(d.entries||[]),inc]});
  showToast("✓ Interés de "+fmt(amt)+" cobrado");
}
// Cobrar capital: recuperas TU dinero (no es ingreso nuevo, no infla el plan del mes).
async function doTerceroCobrarCapital(id){
  const d=D();const tid=Number(id)||id;
  const t=(d.terceros||[]).find(x=>x.id===tid);if(!t)return;
  const raw=terceroAbono[tid];
  const amt=raw?Number(raw):terceroPending(t);
  if(!amt||amt<=0){showToast("⚠️ Ingresa un monto válido");return;}
  const applied=Math.min(amt,terceroPending(t));
  const newPaid=(t.paid||0)+applied;
  const list=(d.terceros||[]).map(x=>x.id===tid?{...x,paid:newPaid,
    payments:[...(x.payments||[]),{date:today(),amount:applied,kind:"capital"}],
    status:newPaid>=x.amount?"settled":"active"}:x);
  await persist({...d,terceros:list});
  terceroAbono[tid]="";
  showToast(newPaid>=t.amount?"🎉 "+t.name+" te pagó todo":"✓ "+fmt(applied)+" de capital recuperado");
}
function doDeleteTercero(id){
  const tid=Number(id)||id;
  if(!confirmDelete||confirmDelete.type!=="tercero"||confirmDelete.id!==tid){confirmDelete={type:"tercero",id:tid};setTimeout(()=>{confirmDelete=null;render();},3000);render();return;}
  confirmDelete=null;
  const d=D();
  const t=(d.terceros||[]).find(x=>x.id===tid);if(!t)return;
  persist({...d,terceros:(d.terceros||[]).filter(x=>x.id!==tid),trash:[...(d.trash||[]),{...t,_kind:"tercero",_deletedAt:today()}]});
  showToast("🗑️ Movido a papelera");
}

function renderBalanceCard(d){

  const netLoanA=activeLoans.reduce((s,l)=>{const rem=l.amount-l.paid;return l.from==="A"?s+rem:s-rem;},0);
  const totalNet=balA+netLoanA;
  let balHtml="";

  const settledHtml=(d.settled||[]).map((sl,idx)=>({sl,idx})).slice(-4).reverse().map(({sl,idx})=>`
    <div class="row" style="margin-bottom:4px;align-items:center;">
      <span style="font-size:11px;color:var(--ink3);font-family:monospace;">${sl.date} · ${nm(sl.from)}→${nm(sl.to)}</span>
      <span style="display:flex;align-items:center;gap:10px;">
        <span style="font-size:11px;color:var(--good);font-family:monospace;">${fmt(sl.amount)}</span>
        <span style="cursor:pointer;font-size:11px;font-family:monospace;color:${confirmDelete&&confirmDelete.type==="settled"&&confirmDelete.id===idx?"var(--bad)":"var(--ink3)"};" onclick="doDeleteSettled(${idx})">${confirmDelete&&confirmDelete.type==="settled"&&confirmDelete.id===idx?"¿borrar?":"🗑️"}</span>
      </span>
    </div>`).join("");
  const sp2=d.split||{A:50,B:50};
  return`<div class="card card-gold">
    <div class="ct">Balance equitativo · ${sp2.A}/${sp2.B}</div>
    ${balHtml}
    ${settledHtml?`<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line2);"><div style="font-size:9px;color:var(--ink3);font-family:monospace;text-transform:uppercase;margin-bottom:6px;">Saldos registrados · toca 🗑️ para corregir</div>${settledHtml}</div>`:""}
  </div>`;
}

function renderThisMonthCard(d){
  const sp=d.split||{A:50,B:50};
  const spA=sp.A/100,spB=sp.B/100;
  const tm=thisMonth();
  const [ty,tmn]=tm.split("-").map(Number);
  const pm=tmn===1?`${ty-1}-12`:`${ty}-${String(tmn-1).padStart(2,"0")}`;
  const me=(d.entries||[]).filter(e=>e.date&&e.date.startsWith(tm));
  const pe=(d.entries||[]).filter(e=>e.date&&e.date.startsWith(pm));
  const tS=me.filter(e=>e.type==="expense"&&e.user==="shared").reduce((s,e)=>s+e.amount,0);
  const tA=me.filter(e=>e.type==="expense"&&e.user==="A").reduce((s,e)=>s+e.amount,0);
  const tB=me.filter(e=>e.type==="expense"&&e.user==="B").reduce((s,e)=>s+e.amount,0);
  const iA=me.filter(e=>e.type==="income"&&e.user==="A").reduce((s,e)=>s+e.amount,0);
  const iB=me.filter(e=>e.type==="income"&&e.user==="B").reduce((s,e)=>s+e.amount,0);
  const pTotal=pe.filter(e=>e.type==="expense").reduce((s,e)=>s+e.amount,0);
  const cTotal=tS+tA+tB;
  const deltaHtml=pTotal>0?(()=>{
    const pct=Math.round((cTotal-pTotal)/pTotal*100);
    const up=pct>=0;
    return`<span style="font-size:10px;color:${up?"var(--bad)":"var(--good)"};font-family:monospace;margin-left:6px;">${up?"▲":"▼"} ${Math.abs(pct)}% vs ${pm}</span>`;
  })():"";
  return`<div class="card">
    <div class="ct">Este mes — ${tm} · ¿cuánto pone cada uno?</div>
    <table style="width:100%;border-collapse:collapse;">
      <thead><tr>
        <th style="text-align:left;font-size:10px;color:var(--ink3);font-family:monospace;text-transform:uppercase;padding-bottom:8px;"></th>
        <th style="text-align:right;font-size:12px;color:var(--pa);font-weight:700;padding-bottom:8px;">${d.names.A}</th>
        <th style="text-align:right;font-size:12px;color:var(--pb);font-weight:700;padding-bottom:8px;">${d.names.B}</th>
      </tr></thead>
      <tbody style="font-family:monospace;">
        <tr><td style="font-size:12px;color:var(--ink2);padding:4px 0;">💰 Ingresos</td><td style="text-align:right;font-size:13px;color:var(--good);">${fmt(iA)}</td><td style="text-align:right;font-size:13px;color:var(--good);">${fmt(iB)}</td></tr>
        <tr><td style="font-size:12px;color:var(--ink2);padding:4px 0;">💸 Gastos personales</td><td style="text-align:right;font-size:13px;color:var(--bad);">${fmt(tA)}</td><td style="text-align:right;font-size:13px;color:var(--bad);">${fmt(tB)}</td></tr>
        <tr><td style="font-size:12px;color:var(--ink2);padding:4px 0;">🤝 Aporte compartido</td><td style="text-align:right;font-size:13px;color:var(--bad);">${fmt(tS*spA)}<span style="font-size:9px;color:var(--ink3);"> ${sp.A}%</span></td><td style="text-align:right;font-size:13px;color:var(--bad);">${fmt(tS*spB)}<span style="font-size:9px;color:var(--ink3);"> ${sp.B}%</span></td></tr>
        <tr style="border-top:1px solid var(--line2);"><td style="font-size:12px;color:var(--ink);font-weight:600;padding:6px 0 4px;">Total a cubrir</td><td style="text-align:right;font-size:13px;color:var(--ink);font-weight:700;padding-top:6px;">${fmt(tA+tS*spA)}</td><td style="text-align:right;font-size:13px;color:var(--ink);font-weight:700;padding-top:6px;">${fmt(tB+tS*spB)}</td></tr>
        <tr><td style="font-size:12px;color:var(--ink2);padding:4px 0;">Disponible</td><td style="text-align:right;font-size:13px;font-weight:700;color:${(iA-tA-tS*spA)>=0?"var(--good)":"var(--bad)"};">${fmt(iA-tA-tS*spA)}</td><td style="text-align:right;font-size:13px;font-weight:700;color:${(iB-tB-tS*spB)>=0?"var(--good)":"var(--bad)"};">${fmt(iB-tB-tS*spB)}</td></tr>
      </tbody>
    </table>
    <div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:11px;color:var(--ink2d);font-family:monospace;display:flex;justify-content:space-between;align-items:center;"><span>Gasto compartido del mes</span><span style="color:var(--gold);font-weight:600;">${fmt(tS)}${deltaHtml}</span></div>
  </div>`;
}

function renderWeekCard(d){
  const wa=new Date();wa.setDate(wa.getDate()-7);
  const ws=wa.toISOString().slice(0,10);
  const wk=(d.entries||[]).filter(e=>e.date>=ws&&e.type==="expense");
  const wt=wk.reduce((s,e)=>s+e.amount,0);
  const wsh=wk.filter(e=>e.user==="shared").reduce((s,e)=>s+e.amount,0);
  return`<div class="card card-blue">
    <div class="ct">Últimos 7 días</div>
    <div style="display:flex;justify-content:space-around;">
      <div style="text-align:center;"><div style="font-size:10px;color:var(--ink3);font-family:monospace;margin-bottom:3px;">TOTAL</div><div style="font-size:16px;font-weight:700;color:var(--teal);">${fmtS(wt)}</div></div>
      <div style="width:1px;background:var(--line);"></div>
      <div style="text-align:center;"><div style="font-size:10px;color:var(--ink3);font-family:monospace;margin-bottom:3px;">COMPARTIDO</div><div style="font-size:16px;font-weight:700;color:var(--gold);">${fmtS(wsh)}</div></div>
      <div style="width:1px;background:var(--line);"></div>
      <div style="text-align:center;"><div style="font-size:10px;color:var(--ink3);font-family:monospace;margin-bottom:3px;">REGISTROS</div><div style="font-size:16px;font-weight:700;color:var(--ink);">${wk.length}</div></div>
    </div>
  </div>`;
}

function renderResumen(){
  const d=D();
  const currentCount=(d.entries||[]).length;
  const newCount=currentCount-lastSeenCount;
  const tm=thisMonth();
  const me=(d.entries||[]).filter(e=>e.date&&e.date.startsWith(tm));
  const debts=(d.entries||[]).filter(e=>e.type==="debt");
  const budgets=d.budgets||{};
  const alerts=Object.entries(budgets).map(([cat,lim])=>{
    const sp2=me.filter(e=>e.type==="expense"&&e.category===cat).reduce((s,e)=>s+e.amount,0);
    return{cat,lim,sp2,pct:sp2/lim*100};
  }).filter(b=>b.pct>=70).sort((a,b)=>b.pct-a.pct);

  const alertsHtml=alerts.length>0?`
    <div class="card card-warn">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div class="ct" style="color:var(--gold);margin-bottom:0;">⚠️ Alertas de presupuesto</div>
        <span style="font-size:10px;color:var(--gold);cursor:pointer;font-family:monospace;border:1px solid color-mix(in srgb, var(--gold) 27%, transparent);padding:3px 8px;border-radius:6px;" onclick="settingsTab='budgets';configTab='ajustes';moreTab='config';tab='mas';render()">editar límites →</span>
      </div>
      ${alerts.map(b=>`
        <div style="margin-bottom:10px;">
          <div class="row"><span style="font-size:13px;">${icon(b.cat)} ${b.cat}</span><span style="font-size:12px;color:${b.pct>=100?"var(--bad)":"var(--gold)"};font-family:monospace;font-weight:600;">${Math.round(b.pct)}%${b.pct>=100?" ⚠️":""}</span></div>
          <div class="bar-wrap"><div class="bar" style="width:${Math.min(b.pct,100)}%;background:${b.pct>=100?"var(--bad)":"var(--gold)"};"></div></div>
          <div style="font-size:10px;color:var(--ink3);font-family:monospace;">${fmt(b.sp2)} de ${fmt(b.lim)}</div>
        </div>`).join("")}
    </div>`:"";

  const goalsHtml=(d.goals||[]).length>0?`
    <div class="card">
      <div class="ct">Metas de ahorro</div>
      ${(d.goals||[]).map(g=>{
        const pct=Math.min(100,g.current/g.target*100);
        return`<div style="margin-bottom:14px;">
          <div class="row"><span style="font-size:14px;font-weight:600;">${g.name}</span><span style="font-size:12px;color:var(--gold);font-family:monospace;">${Math.round(pct)}%</span></div>
          <div class="row" style="margin-bottom:5px;"><span style="font-size:11px;color:var(--ink3);font-family:monospace;">${fmt(g.current)}</span><span style="font-size:11px;color:var(--ink3);font-family:monospace;">${fmt(g.target)}</span></div>
          <div class="bar-wrap"><div class="bar" style="width:${pct}%;background:${pct>=100?"var(--good)":"var(--gold)"};box-shadow:0 0 8px ${pct>=100?"color-mix(in srgb, var(--good) 38%, transparent)":"color-mix(in srgb, var(--gold) 38%, transparent)"};"></div></div>
          ${g.deadline?`<div style="font-size:10px;color:var(--ink3);margin-top:3px;font-family:monospace;">Meta: ${g.deadline} · faltan ${fmt(g.target-g.current)}</div>`:""}
        </div>`;}).join("")}
    </div>`:"";

  const notifHtml=newCount>0&&lastSeenCount>0?`
    <div style="background:var(--surf-info);border:1px solid color-mix(in srgb, var(--pa) 27%, transparent);border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;" onclick="dismissNotif()">
      <div>
        <div style="font-size:13px;color:var(--pa);font-weight:600;">🆕 ${newCount} gasto${newCount!==1?"s":""} nuevo${newCount!==1?"s":""}</div>
        <div style="font-size:11px;color:var(--ink3);margin-top:2px;">agregado${newCount!==1?"s":""} desde tu última visita · toca para marcar como visto</div>
      </div>
      <span style="font-size:18px;">✕</span>
    </div>`:"";

  // Hero de consejo (primer insight del asesor)
  const insights=advisorInsights(d);
  const hero=insights[0];
  const heroHtml=hero?`<div class="card-advice"><div style="font-size:15px;font-weight:700;margin-bottom:5px;">${hero.icon} ${hero.title}</div><div style="font-size:13px;color:var(--ink2);line-height:1.55;margin-bottom:${hero.cta?"10px":"0"};">${hero.body}</div>${hero.cta?`<button class="btn-sm" style="background:var(--gold);color:var(--on-accent);font-weight:700;" onclick="${insightCta(hero.cta)}">${hero.cta.label}</button>`:""}</div>`:"";
  // Semáforo (3 chips derivados)
  const netBal=computeBalance(d);
  const activeLoans=(d.loans||[]).filter(l=>l.status==="active");
  const netLoanA=activeLoans.reduce((s,l)=>l.from==="A"?s+(l.amount-l.paid):s-(l.amount-l.paid),0);
  const totalNet=netBal+netLoanA;
  // Libre = plan real del mes (ingreso recurrente − obligaciones − lo que ya apartaste).
  const dispB=libreManiobra(d,tm);
  const asigNow=totalAsignado(d,tm);
  const deudaTotal=debtsOf(d).reduce((s,de)=>s+pendingOf(d,de),0);
  const semHtml=`<div class="sem">
    <div class="sem-chip" onclick="showBalDetail=true;render()"><div class="k">Balance pareja</div><div class="v" style="color:${Math.abs(totalNet)<1?"var(--good)":"var(--gold)"};">${Math.abs(totalNet)<1?"al día ✓":fmt(Math.abs(totalNet))}</div></div>
    <div class="sem-chip" onclick="tab='asesor';asesorTab='plan';render()"><div class="k">Libre para maniobrar</div><div class="v" style="color:${dispB>=0?"var(--good)":"var(--bad)"};">${fmt(dispB)}</div>${asigNow>0?`<div style="font-size:9px;color:var(--ink3);font-family:var(--num);margin-top:1px;">${fmt(asigNow)} apartado</div>`:""}</div>
    <div class="sem-chip" onclick="tab='deudas';render()"><div class="k">Deuda total</div><div class="v" style="color:var(--bad);">${fmt(deudaTotal)}</div></div>
  </div>`;
  // Mini-deudas (top 3 por pendiente, solo lectura)
  const debtsList=debtsOf(d).map(de=>({de,pend:pendingOf(d,de)})).filter(x=>x.pend>0.5).sort((a,b)=>b.pend-a.pend).slice(0,3);
  const miniDebtsHtml=debtsList.length?`<div class="card"><div class="row" style="margin-bottom:8px;"><div class="ct" style="margin:0;">Deudas — top pendientes</div><span style="font-size:11px;color:var(--gold);cursor:pointer;font-family:monospace;" onclick="tab='deudas';render()">Ver todas →</span></div>
    ${debtsList.map(x=>{const pct=x.de.amount>0?(1-x.pend/x.de.amount)*100:0;return`<div class="mini-debt"><div class="row" style="margin:0 0 4px;"><span style="font-size:13px;">${icon(x.de.category)} ${x.de.description}</span><span style="font-size:12px;color:var(--bad);font-family:monospace;">${fmt(x.pend)}</span></div><div class="bar-wrap" style="height:6px;margin:0;"><div class="bar" style="width:${pct}%;background:var(--gold);"></div></div></div>`;}).join("")}
  </div>`:"";

  const hayMovsMes=me.some(e=>e.type==="expense"||e.type==="income");
  const wa2=new Date();wa2.setDate(wa2.getDate()-7);
  const hayMovsSemana=(d.entries||[]).some(e=>e.date>=wa2.toISOString().slice(0,10)&&e.type==="expense");
  return`<div class="sec">
    ${notifHtml}
    ${heroHtml}
    ${semHtml}
    <div class="grid-2">
      ${renderBalanceCard(d)}
      ${hayMovsMes?renderThisMonthCard(d):renderMonthEmptyCard(d,tm)}
    </div>
    ${miniDebtsHtml}
    ${alertsHtml}
    ${goalsHtml}
    ${hayMovsSemana?renderWeekCard(d):""}
  </div>`;
}

// Drill-down: shows each unsettled shared expense and how it builds the balance.
function renderBalanceDetail(d){
  const sp=d.split||{A:50,B:50};const spA=sp.A/100,spB=sp.B/100;
  const shExp=(d.entries||[]).filter(e=>e.type==="expense"&&e.user==="shared"&&e.paidBy)
    .slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  if(shExp.length===0)return`<div style="font-size:11px;color:var(--ink3);font-family:monospace;margin-bottom:8px;">Sin gastos compartidos con pagador asignado.</div>`;
  const shown=shExp.slice(0,30);
  const rows=shown.map(e=>{
    const payer=e.paidBy;
    const owesAmt=payer==="A"?Math.round(e.amount*spB):Math.round(e.amount*spA);
    const ower=payer==="A"?d.names.B:d.names.A;
    const payerNm=payer==="A"?d.names.A:d.names.B;
    return`<div style="padding:5px 0;border-bottom:1px solid color-mix(in srgb, var(--line) 13%, transparent);">
      <div class="row" style="align-items:flex-start;">
        <span style="font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${icon(e.category)} ${e.description||e.category}</span>
        <span style="font-size:12px;font-family:monospace;color:var(--ink);white-space:nowrap;margin-left:8px;">${fmt(e.amount)}</span>
      </div>
      <div style="font-size:10px;color:var(--ink2d);font-family:monospace;">${e.date} · pagó ${payerNm} → <span style="color:var(--gold);">${ower} debe ${fmt(owesAmt)}</span></div>
    </div>`;
  }).join("");
  const moreNote=shExp.length>30?`<div style="font-size:10px;color:var(--ink3);font-family:monospace;text-align:center;padding-top:6px;">… y ${shExp.length-30} gastos más</div>`:"";
  // All settlements: legacy settled[], legacy catSettled[], and new transfer entries
  const allPayments=[
    ...(d.settled||[]).map(s=>({date:s.date,from:nm(s.from),to:nm(s.to),amount:s.amount})),
    ...(d.catSettled||[]).map(s=>({date:s.date,from:nm(s.from),to:nm(s.to),amount:s.amount})),
    ...(d.entries||[]).filter(e=>e.type==="transfer").map(e=>({date:e.date,from:nm(e.paidBy||"A"),to:nm(e.paidBy==="A"?"B":"A"),amount:e.amount,note:e.description}))
  ].sort((a,b)=>b.date.localeCompare(a.date));
  const paymentsHtml=allPayments.length>0?`
    <div style="border-top:1px solid color-mix(in srgb, var(--line) 13%, transparent);margin-top:6px;padding-top:6px;">
      <div style="font-size:9px;color:var(--teal);font-family:monospace;text-transform:uppercase;margin-bottom:4px;">Abonos y saldos registrados</div>
      ${allPayments.map(p=>`<div style="display:flex;justify-content:space-between;padding:3px 0;"><span style="font-size:10px;color:var(--teal);font-family:monospace;">${p.date} · ${p.from}→${p.to}${p.note?(" · "+p.note):""}</span><span style="font-size:10px;color:var(--teal);font-family:monospace;">-${fmt(p.amount)}</span></div>`).join("")}
    </div>`:"";
  // Consolidado por proyecto (categoría): cuánto adelantó cada quién, y cómo se compensan.
  // Incluye TODO lo que afecta computeBalance (gastos compartidos + abonos/transfers + settled
  // legacy) para que el NETO cuadre exactamente con el balance real de arriba.
  const byCat={};
  const bump=(k,adv)=>{if(!byCat[k])byCat[k]={paidA:0,total:0};byCat[k].adv=(byCat[k].adv||0)+adv;};
  shExp.forEach(e=>{
    const k=e.category||"Otro";
    if(!byCat[k])byCat[k]={total:0,paidA:0};
    byCat[k].total+=e.amount;
    if(e.paidBy==="A")byCat[k].paidA+=e.amount;
  });
  (d.entries||[]).filter(e=>e.type==="transfer").forEach(e=>bump(e.category||"Abonos",e.paidBy==="A"?e.amount:-e.amount));
  (d.catSettled||[]).forEach(s=>bump(s.cat||"Ajustes",s.to==="B"?s.amount:-s.amount));
  (d.settled||[]).forEach(s=>bump("Ajustes",s.to==="B"?s.amount:-s.amount));
  const isAdjBucket=k=>k==="Abonos"||k==="Ajustes";
  const catRows=Object.entries(byCat).map(([k,v])=>({k,advA:Math.round((v.paidA||0)-(v.total||0)*spA+(v.adv||0))}))
    .filter(x=>Math.abs(x.advA)>1).sort((a,b)=>Math.abs(b.advA)-Math.abs(a.advA));
  const netExp=catRows.reduce((s,x)=>s+x.advA,0); // >0: Marce adelantó (John le debe)
  const consolidadoHtml=catRows.length>0?`
    <div style="border-top:1px solid color-mix(in srgb, var(--line) 13%, transparent);margin-top:6px;padding-top:6px;">
      <div style="font-size:9px;color:var(--gold);font-family:monospace;text-transform:uppercase;margin-bottom:4px;">⚖️ Adelantos por proyecto (se compensan entre sí)</div>
      ${catRows.map(x=>{const who=x.advA>0?d.names.A:d.names.B;const col=x.advA>0?"var(--pa)":"var(--pb)";const lbl=isAdjBucket(x.k)?`${who} abonó`:`${who} adelantó`;const ic=isAdjBucket(x.k)?"💳":icon(x.k);return`<div style="display:flex;justify-content:space-between;padding:3px 0;"><span style="font-size:10px;color:var(--ink2);font-family:monospace;">${ic} ${x.k}</span><span style="font-size:10px;color:${col};font-family:monospace;">${lbl} ${fmt(Math.abs(x.advA))}</span></div>`;}).join("")}
      <div style="display:flex;justify-content:space-between;padding:5px 0 0;margin-top:3px;border-top:1px solid var(--line2);"><span style="font-size:10px;color:var(--ink);font-family:monospace;font-weight:700;">NETO tras compensar</span><span style="font-size:10px;color:var(--gold);font-family:monospace;font-weight:700;">${Math.abs(netExp)<1?"equilibrado ✓":(netExp>0?d.names.B+" debe "+fmt(netExp):d.names.A+" debe "+fmt(-netExp))}</span></div>
    </div>`:"";
  return`<div style="background:var(--inset);border-radius:8px;padding:8px 10px;margin-bottom:10px;max-height:340px;overflow-y:auto;border:1px solid var(--line);">

    ${consolidadoHtml}
    <div style="font-size:9px;color:var(--ink3);font-family:monospace;text-transform:uppercase;margin:8px 0 4px;">Movimientos</div>
    ${rows}${moreNote}${paymentsHtml}
  </div>`;
}

// Matches cuota payments to a debt: by explicit debtId (new data), else by "Cuota "+description (legacy).
function paymentsForDebt(d,de){
  const label="Cuota "+(de.description||"");
  return (d.entries||[]).filter(e=>e.type==="expense"&&(e.debtId===de.id||e.description===label))
    .slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
}

// Groups a debt's payments into "cuota events" (same date + same debt) so each
// cuota is one row that can be split between the two people.
function paymentGroups(d,de){
  const pays=paymentsForDebt(d,de);
  const gs={};
  pays.forEach(p=>{
    const gk=de.id+"|"+(p.date||"");
    if(!gs[gk])gs[gk]={key:gk,ids:[],date:p.date,debtId:de.id,desc:de.description,payDesc:p.description||("Cuota "+de.description),category:p.category||de.category,user:de.user,amtA:0,amtB:0,total:0,note:null};
    const g=gs[gk];g.ids.push(p.id);g.total+=p.amount||0;
    if(p.paidBy==="A")g.amtA+=p.amount;else if(p.paidBy==="B")g.amtB+=p.amount;else g.amtA+=p.amount; // personal: attribute to the single debtor slot
    if(p.note&&!g.note)g.note=p.note;
  });
  return Object.values(gs).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
}

// Cuota real del mes: si hay un recurrente con overrides que coincida (misma cat+desc),
// usa el monto de ESE mes (respeta primas/cesantías/variaciones); si no, usa el promedio plano.
function cuotaForMonth(d,de,monthKey){
  const months=de.debtMonths||1;
  const flat=(de.minPayment&&Number(de.minPayment)>0)?Number(de.minPayment):(months>1?Math.round(de.amount/months):de.amount);
  const rec=(d.recurring||[]).find(r=>r.type==="debt"&&r.category===de.category&&r.description===de.description);
  if(rec&&rec.overrides&&rec.overrides[monthKey]!=null)return ovTotal(rec.overrides[monthKey],flat);
  return flat;
}

// Human-readable classification of an entry — used for clear differentiation in lists.
function entryKind(e){
  if(e.type==="income"){
    const src=e.incomeSource;
    const label=src==="pareja"?"Pago de pareja":src==="otro"?"Otro ingreso":"Nómina / salario";
    return{label,emoji:"💰",color:"var(--good)",bg:"color-mix(in srgb, var(--good) 9%, transparent)",bd:"color-mix(in srgb, var(--good) 20%, transparent)"};
  }
  if(e.type==="transfer"){
    const payer=nm(e.paidBy||"A");
    const receiver=nm(e.paidBy==="A"?"B":"A");
    return{label:`Abono: ${payer} → ${receiver}`,emoji:"💳",color:"var(--teal)",bg:"color-mix(in srgb, var(--teal) 9%, transparent)",bd:"color-mix(in srgb, var(--teal) 20%, transparent)"};
  }
  if(e.type==="loan_payment"){
    return{label:`Pago préstamo`,emoji:"🤝",color:"var(--pa)",bg:"color-mix(in srgb, var(--pa) 9%, transparent)",bd:"color-mix(in srgb, var(--pa) 20%, transparent)"};
  }
  if(e.type==="debt"){
    const n=e.debtMonths||1;
    return{label:n>1?`Deuda · ${n} cuotas`:"Deuda",emoji:"🏦",color:"var(--bad)",bg:"color-mix(in srgb, var(--bad) 9%, transparent)",bd:"color-mix(in srgb, var(--bad) 20%, transparent)"};
  }

// ── Asesor ─────────────────────────────────────────────────────────────────
async function doSetStrategy(s){const d=D();await persist({...d,plan:{...(d.plan||{}),strategy:s}});}
function allocRow(label,amount,col){return `<div class="row" style="margin-bottom:6px;"><span style="font-size:13px;color:var(--ink2);">${label}</span><span style="font-size:14px;font-weight:700;color:${col};font-family:monospace;">${fmt(amount)}</span></div>`;}
function simSparkline(timeline){
  const n=timeline.length;const W=Math.max(280,n*10),H=70,p=6;
  const max=Math.max(...timeline.map(t=>t.totalBal),1);
  const pts=timeline.map((t,i)=>{const x=p+(W-2*p)*(i/(n-1||1));const y=p+(H-2*p)*(1-t.totalBal/max);return x.toFixed(1)+","+y.toFixed(1);});
  return `<div style="overflow-x:auto;margin-top:10px;background:var(--bg2);border-radius:8px;padding:4px;"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="display:block;"><polyline points="${pts.join(" ")}" fill="none" stroke="var(--gold)" stroke-width="2"/><line x1="${p}" x2="${W-p}" y1="${H-p}" y2="${H-p}" stroke="var(--line)" stroke-width="0.5"/></svg></div>`;
}
function renderAsesor(){
  const bar=subTabBar([["prioridad","🎯","Prioridad"],["plan","💰","Mi plan"],["simular","🧮","Simular"],["proyeccion","📉","Proyección"]],asesorTab,"asesorTab");

  else body=renderAsesorPrioridad(d);
  return bar+body;
}
function renderAsesorPrioridad(d){
  const strat=(d.plan&&d.plan.strategy)||"avalanche";

  const medals=["🥇","🥈","🥉"];
  let html=`<div class="sec">`;

    <div class="chip${strat==="avalanche"?" on":""}" onclick="doSetStrategy('avalanche')">📉 Avalancha</div>

  if(bleed>0)html+=`<div class="card-quiet" style="border:1px solid color-mix(in srgb, var(--bad) 20%, transparent);margin-bottom:12px;"><div class="row" style="margin:0;"><span style="font-size:12px;color:var(--ink2);">🩸 Intereses tuyos este mes</span><span style="font-size:16px;font-weight:700;color:var(--bad);font-family:monospace;">${fmt(Math.round(bleed))}</span></div><div style="font-size:10px;color:var(--ink3);font-family:monospace;margin-top:4px;">≈ ${fmt(Math.round(bleed*12))} al año si nada cambia</div></div>`;
  if(rk.length===0){
    html+=`<div class="card-quiet debt-notice" style="text-align:center;padding:24px;"><div style="font-size:13px;color:var(--ink2);">No hay deudas activas para priorizar 🎉</div></div>`;
  }else{
    rk.forEach((x,i)=>{
      const rankCls=i===0?"rank-1":i===1?"rank-2":i===2?"rank-3":"";
      const medal=medals[i]||"▫️";
      html+=`<div class="card ${rankCls}">
        <div class="row" style="margin-bottom:4px;">
          <span style="font-size:14px;font-weight:700;">${medal} ${x.de.description}</span>
          <span class="pill-rate${x.hasRate?"":" debt-notice"}" style="${x.hasRate?"":"background:var(--inset);color:var(--ink2d);border-color:var(--ink3);"}">${x.hasRate?rateLabel(x.de):"sin tasa"}</span>
        </div>
        <div style="font-size:11px;color:var(--ink2d);font-family:monospace;margin-bottom:6px;">Saldo ${fmt(x.pending)}${x.shared?` · compartida, tu parte ${fmt(Math.round(x.myShare))}`:""}</div>`;
      if(x.interestMonth!=null&&x.interestMonth>0)html+=`<div class="row" style="margin:0 0 6px;"><span style="font-size:11px;color:var(--ink2);">Interés este mes</span><span style="font-size:13px;font-weight:700;color:var(--bad);font-family:monospace;">${fmt(Math.round(x.interestMonth))}</span></div>`;
      else if(x.hasRate&&x.mRate<=0)html+=`<div style="font-size:11px;color:var(--good);margin-bottom:6px;">✓ No genera intereses</div>`;
      if(i===0&&x.hasRate)html+=`<div style="font-size:12px;color:var(--gold);font-weight:600;margin-bottom:8px;">▸ Ataca esta primero — aquí se te va más plata</div>`;
      if(!x.hasRate)html+=`<div style="font-size:11px;color:var(--ink3);margin-bottom:8px;">Agrega su tasa para priorizarla por costo real.</div>`;
      html+=`<div style="display:flex;gap:8px;">

      </div></div>`;
    });
  }
  if(locked.length)html+=`<div class="card-quiet"><div style="font-size:11px;color:var(--ink2d);font-family:monospace;line-height:1.5;">🔒 Pactadas (fuera de la priorización): ${locked.map(de=>de.description).join(", ")}. Se gestionan en la pestaña Deudas.</div></div>`;
  const feed=advisorInsights(d).filter(ins=>ins.icon!=="🎯");
  if(feed.length){
    html+=`<div class="ct" style="margin:14px 0 8px;">Consejos</div>`;
    feed.forEach(ins=>{
      const col=ins.sev==="bad"?"var(--bad)":ins.sev==="warn"?"var(--gold)":ins.sev==="ok"?"var(--good)":"var(--teal)";
      html+=`<div class="card-quiet" style="border-left:3px solid ${col};"><div style="font-size:13px;font-weight:600;margin-bottom:3px;">${ins.icon} ${ins.title}</div><div style="font-size:12px;color:var(--ink2);line-height:1.5;">${ins.body}</div>${ins.cta?`<div style="margin-top:6px;"><span style="font-size:11px;color:${col};cursor:pointer;font-family:monospace;" onclick="${insightCta(ins.cta)}">${ins.cta.label}</span></div>`:""}</div>`;
    });
  }
  html+=`</div>`;
  return html;

function renderAsesorSimular(d){

  const base=simulatePayoff(d,strat,0);

  html+=`<div class="card"><div class="ct">Abono extra mensual${top?" · dirigido a "+top.de.description:""}</div>

    html+=`<div class="card card-gold"><div style="display:flex;justify-content:space-around;text-align:center;gap:8px;">

    </div>`;
  }
  html+=`</div>`;
  return html;
}
